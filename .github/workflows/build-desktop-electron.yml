name: Build Desktop Electron

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_desktop_electron:
    name: Build Desktop Electron
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Export version artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/export-version.sh
          ./scripts/check-version.sh

      - name: Resolve release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/resolve-release-plan.sh scripts/manifest-v2.sh
          ./scripts/resolve-release-plan.sh --github-output release-manifest.json

      - name: Validate electron implementation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.plan.outputs.implementation }}" != "electron" ]]; then
            echo "build-desktop-electron invoked while manifest implementation is not electron"
            exit 1
          fi
          test -d apps/desktop-electron
          test -f apps/desktop-electron/package.json

      - name: Build electron desktop publish output
        shell: pwsh
        run: |
          $publishDir = "${{ steps.plan.outputs.publish_subdir }}"
          $mainExe = "${{ steps.plan.outputs.main_exe }}"
          if (Test-Path "apps/desktop-electron/package-lock.json") {
            npm ci --prefix apps/desktop-electron
          } else {
            npm install --prefix apps/desktop-electron
          }
          Push-Location apps/desktop-electron
          try {
            $buildScript = (npm run 2>$null | Select-String -Pattern '^\s+build:desktop\b')
            if (-not $buildScript) {
              throw "Formal electron desktop build is not wired yet. Add an npm script 'build:desktop' that emits '$publishDir/$mainExe', or keep components.desktop.implementation='avalonia'. See docs/migration/desktop-electron-cutover.md"
            }
            npm run build:desktop
          } finally {
            Pop-Location
          }
          $exePath = Join-Path $publishDir $mainExe
          if (-not (Test-Path $exePath)) {
            throw "Expected electron publish output missing: $exePath"
          }

      - name: Upload desktop publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.desktop_artifact_name }}
          path: ${{ steps.plan.outputs.publish_subdir }}/
          if-no-files-found: error
