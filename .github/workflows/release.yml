name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build_agent:
    uses: ./.github/workflows/release-build-agent.yml
    secrets: inherit

  build_ui:
    uses: ./.github/workflows/release-build-ui.yml
    needs: build_agent
    secrets: inherit

  release_notes:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-generate-notes.yml
    needs: build_ui
    secrets: inherit

  publish_assets:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release-publish-assets.yml
    needs:
      - build_ui
      - release_notes
    secrets: inherit
