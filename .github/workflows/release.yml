name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release_notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: build_windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelogithub release
        uses: antfu/changelogithub-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    name: Build Windows Assets
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Add dotnet tools path
        shell: pwsh
        run: |
          "$env:USERPROFILE\\.dotnet\\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install vpk
        shell: pwsh
        run: dotnet tool install -g vpk

      - name: Install AutoHotkey
        shell: pwsh
        run: choco install autohotkey --no-progress -y

      - name: Resolve Ahk2Exe compiler
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ahkBase = "C:\Program Files\AutoHotkey"
          $ahk64Candidates = @(
            (Join-Path $ahkBase "v2\AutoHotkey64.exe"),
            (Join-Path $ahkBase "AutoHotkey64.exe")
          )
          $ahk64 = $ahk64Candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ahk64) {
            throw "AutoHotkey64.exe not found under C:\Program Files\AutoHotkey."
          }
          "AHK64_PATH=$ahk64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $api = "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $release.assets `
            | Where-Object { $_.name -match '^Ahk2Exe[\w\.\-]*\.zip$' } `
            | Select-Object -First 1
          if (-not $asset) {
            $assetNames = ($release.assets | Select-Object -ExpandProperty name) -join ", "
            throw "No Ahk2Exe zip asset found in latest release. assets=[$assetNames]"
          }
          Write-Host "Using Ahk2Exe asset: $($asset.name)"

          $stageRoot = Join-Path $env:RUNNER_TEMP "ahk2exe-stage"
          $zipPath = Join-Path $stageRoot "Ahk2Exe.zip"
          $extractRoot = Join-Path $stageRoot "extract"
          if (Test-Path $stageRoot) {
            Remove-Item -Path $stageRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          Invoke-WebRequest -Uri $asset.url -Headers @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/octet-stream"
          } -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force

          $compilerSource = Get-ChildItem -Path $extractRoot -Recurse -File -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compilerSource) {
            throw "Downloaded Ahk2Exe asset but Ahk2Exe.exe was not found in extracted contents."
          }

          $compilerTargetDir = Join-Path $ahkBase "Compiler"
          if (Test-Path $compilerTargetDir) {
            Remove-Item -Path $compilerTargetDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $compilerTargetDir | Out-Null
          Copy-Item -Path (Join-Path $extractRoot "*") -Destination $compilerTargetDir -Recurse -Force

          $compilerPath = Join-Path $compilerTargetDir "Ahk2Exe.exe"
          if (-not (Test-Path $compilerPath)) {
            throw "Ahk2Exe deploy failed: $compilerPath not found after copy."
          }
          "AHK2EXE_PATH=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Ahk2Exe deployed to: $compilerTargetDir"

      - name: Export version artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/export-version.sh
          ./scripts/check-version.sh

      - name: Read release manifest
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.agentVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid agentVersion in release-manifest.json: $($manifest.agentVersion)"
          }
          "UI_VERSION=$($manifest.uiVersion)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AGENT_VERSION=$($manifest.agentVersion)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHANNEL=$($manifest.build.channel)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile AHK agent exe
        shell: pwsh
        run: |
          Write-Host "Compiling pacinjector.exe from release-manifest agentVersion=$env:AGENT_VERSION"
          $agentVersion4 = "$env:AGENT_VERSION.0"
          $compiler = $env:AHK2EXE_PATH
          $base64 = $env:AHK64_PATH
          if (-not (Test-Path $compiler)) {
            throw "Ahk2Exe.exe not found: $compiler"
          }
          if (-not $base64) {
            throw "AutoHotkey64.exe not found under C:\Program Files\AutoHotkey."
          }
          Write-Host "Using Ahk2Exe: $compiler"
          Write-Host "Using 64-bit base: $base64"

          $toolsDir = "pactoolkits-ui/Tools"
          New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null
          $workspace = $env:GITHUB_WORKSPACE
          $agentDir = Resolve-Path "pactoolkits-agent"
          $entryPath = Join-Path $agentDir "main.__release__.ahk"
          $entryLines = @(
            ";@Ahk2Exe-SetFileVersion $agentVersion4",
            ";@Ahk2Exe-SetProductVersion $agentVersion4",
            ";@Ahk2Exe-SetVersion $agentVersion4",
            "#Include `"$($agentDir.Path)\\main.ahk`""
          )
          Set-Content -Path $entryPath -Value $entryLines -Encoding utf8

          $outExe = Join-Path (Join-Path (Join-Path $workspace "pactoolkits-ui") "Tools") "pacinjector.exe"
          $iconPath = Join-Path (Join-Path (Join-Path $workspace "pactoolkits-agent") "assets") "pacinjection.ico"
          $compilerDir = Split-Path -Path $compiler -Parent
          try {
            Remove-Item -Path $outExe -Force -ErrorAction SilentlyContinue

            $stdoutFile = Join-Path $env:RUNNER_TEMP "ahk2exe.stdout.log"
            $stderrFile = Join-Path $env:RUNNER_TEMP "ahk2exe.stderr.log"
            Remove-Item -Path $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue

            $args = @(
              "/in", $entryPath,
              "/out", $outExe,
              "/icon", $iconPath,
              "/base", $base64,
              "/silent", "verbose"
            )
            Write-Host ("Ahk2Exe args: " + ($args -join " "))

            $proc = Start-Process -FilePath $compiler `
              -ArgumentList $args `
              -WorkingDirectory $compilerDir `
              -NoNewWindow `
              -PassThru `
              -Wait `
              -RedirectStandardOutput $stdoutFile `
              -RedirectStandardError $stderrFile

            if (Test-Path $stdoutFile) {
              Write-Host "Ahk2Exe stdout:"
              Get-Content -Path $stdoutFile | ForEach-Object { Write-Host $_ }
            }
            if (Test-Path $stderrFile) {
              Write-Host "Ahk2Exe stderr:"
              Get-Content -Path $stderrFile | ForEach-Object { Write-Host $_ }
            }

            if ($proc.ExitCode -ne 0) {
              throw "Ahk2Exe exited with code $($proc.ExitCode)"
            }
          }
          finally {
            if (Test-Path $entryPath) {
              Remove-Item $entryPath -Force
            }
          }
          if (-not (Test-Path $outExe)) {
            Write-Host "Compiler directory contents for diagnosis:"
            Get-ChildItem -Path $compilerDir -Force | Select-Object Name, Length, Mode | Format-Table -AutoSize | Out-String | Write-Host
            throw "AHK compile output missing: $outExe"
          }

          # Enforce x64 output by checking PE Machine field (0x8664 = AMD64).
          $bytes = [System.IO.File]::ReadAllBytes($outExe)
          if ($bytes.Length -lt 0x40) {
            throw "Compiled exe is too small to be a valid PE file."
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -le 0 -or ($peOffset + 6) -ge $bytes.Length) {
            throw "Invalid PE header offset in compiled exe."
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Compiled exe is not x64. PE Machine=0x{0:X4}" -f $machine)
          }

          $fileVersion = (Get-Item $outExe).VersionInfo.FileVersion
          $productVersion = (Get-Item $outExe).VersionInfo.ProductVersion
          if ($fileVersion -ne $agentVersion4) {
            throw "FileVersion mismatch. expected=$agentVersion4 actual=$fileVersion"
          }
          if ($productVersion -ne $agentVersion4) {
            throw "ProductVersion mismatch. expected=$agentVersion4 actual=$productVersion"
          }

      - name: Publish UI
        shell: pwsh
        run: |
          dotnet publish pactoolkits-ui/pactoolkits-ui.csproj -c Release -f net8.0 -r win-x64 --self-contained false

      - name: Copy agent exe into publish output
        shell: pwsh
        run: |
          $publishDir = "pactoolkits-ui/bin/Release/net8.0/win-x64/publish"
          $targetTools = Join-Path $publishDir "Tools"
          New-Item -ItemType Directory -Path $targetTools -Force | Out-Null
          Copy-Item "pactoolkits-ui/Tools/pacinjector.exe" (Join-Path $targetTools "pacinjector.exe") -Force

      - name: Pack with vpk
        shell: pwsh
        run: |
          $publishDir = "pactoolkits-ui/bin/Release/net8.0/win-x64/publish"
          $releaseDir = "pactoolkits-ui/Releases"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          vpk pack --packId pactoolkits-ui --packVersion $env:UI_VERSION --packDir $publishDir --outputDir $releaseDir --mainExe pactoolkits-ui.exe --runtime win-x64 --channel $env:CHANNEL --packTitle PacToolkits --packAuthors pacmandoh --noPortable -i pactoolkits-ui/Assets/app.ico

      - name: Collect build outputs
        shell: pwsh
        run: |
          $dist = "_release_assets"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "pactoolkits-ui/Releases/*" $dist -Recurse -Force
          Copy-Item "pactoolkits-ui/Tools/pacinjector.exe" "$dist/pacinjector.exe" -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: _release_assets/*
          if-no-files-found: error

  publish_assets:
    name: Upload Release Assets and Sync Feed
    runs-on: ubuntu-latest
    needs:
      - build_windows
      - release_notes
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

      - name: Prepare SSH for rsync
        env:
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
          FEED_SSH_KNOWN_HOSTS: ${{ secrets.FEED_SSH_KNOWN_HOSTS }}
          FEED_SSH_USER: ${{ secrets.FEED_SSH_USER }}
          FEED_SSH_HOST: ${{ secrets.FEED_SSH_HOST }}
          FEED_SSH_PORT: ${{ secrets.FEED_SSH_PORT }}
          FEED_RSYNC_PATH: ${{ secrets.FEED_RSYNC_PATH }}
        run: |
          set -euo pipefail
          required_vars=(FEED_SSH_KEY FEED_SSH_KNOWN_HOSTS FEED_SSH_USER FEED_SSH_HOST FEED_SSH_PORT FEED_RSYNC_PATH)
          for name in "${required_vars[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s' "$FEED_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$FEED_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync release feed
        env:
          FEED_SSH_USER: ${{ secrets.FEED_SSH_USER }}
          FEED_SSH_HOST: ${{ secrets.FEED_SSH_HOST }}
          FEED_SSH_PORT: ${{ secrets.FEED_SSH_PORT }}
          FEED_RSYNC_PATH: ${{ secrets.FEED_RSYNC_PATH }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            --rsh "ssh -i ~/.ssh/id_ed25519 -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes -p ${FEED_SSH_PORT}" \
            dist/ "${FEED_SSH_USER}@${FEED_SSH_HOST}:${FEED_RSYNC_PATH}/"
