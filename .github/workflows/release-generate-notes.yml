name: Release Generate Notes

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release_notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelogithub release
        uses: antfu/changelogithub-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
