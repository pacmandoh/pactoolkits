name: Package Desktop

on:
  workflow_call:
    inputs:
      desktop_artifact_name:
        required: true
        type: string
      main_exe:
        required: true
        type: string
      icon_path:
        required: true
        type: string
      releases_dir:
        required: true
        type: string
      pack_id:
        required: true
        type: string
      product_version:
        required: true
        type: string
      desktop_version:
        required: true
        type: string
      channel:
        required: true
        type: string
      artifact_retention_days:
        required: false
        type: number
        default: 3
permissions:
  contents: read

jobs:
  package_desktop:
    name: Package Desktop
    runs-on: ubuntu-latest
    env:
      VPK_VERSION: 1.2.0
      DESKTOP_ARTIFACT_NAME: ${{ inputs.desktop_artifact_name }}
      MAIN_EXE: ${{ inputs.main_exe }}
      ICON_PATH: ${{ inputs.icon_path }}
      RELEASES_DIR: ${{ inputs.releases_dir }}
      PACK_ID: ${{ inputs.pack_id }}
      PRODUCT_VERSION: ${{ inputs.product_version }}
      DESKTOP_VERSION: ${{ inputs.desktop_version }}
      CHANNEL: ${{ inputs.channel }}
      RUNTIME: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Add dotnet tools path
        shell: bash
        run: |
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Cache dotnet global tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.dotnet/tools
            ~/.dotnet/toolResolverCache
          key: ${{ runner.os }}-vpk-${{ env.VPK_VERSION }}

      - name: Install vpk
        shell: bash
        run: |
          set -euo pipefail
          installed_version="$(dotnet tool list -g | awk '$1 == "vpk" { print $2 }')"
          if [[ -z "$installed_version" ]]; then
            dotnet tool install -g vpk --version "$VPK_VERSION"
          elif [[ "$installed_version" != "$VPK_VERSION" ]]; then
            dotnet tool update -g vpk --version "$VPK_VERSION"
          fi

      - name: Validate release plan inputs
        shell: bash
        run: |
          set -euo pipefail
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$'
          [[ "$PRODUCT_VERSION" =~ $semver_re ]] || { echo "Invalid product_version: $PRODUCT_VERSION" >&2; exit 1; }
          [[ "$DESKTOP_VERSION" =~ $semver_re ]] || { echo "Invalid desktop_version: $DESKTOP_VERSION" >&2; exit 1; }
          [[ -f "$ICON_PATH" ]] || { echo "Installer icon missing: $ICON_PATH" >&2; exit 1; }
          jq -e '
            ((.components.desktop | keys) == ["avalonia"]) and
            (.components.desktop.avalonia | type == "object") and
            (.components.agents.entry["windows-x64"] | type == "string" and length > 0) and
            (.components.agents.modules | type == "object" and length > 0)
          ' release-manifest.json >/dev/null

      - name: Download desktop publish artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.desktop_artifact_name }}
          path: _desktop_publish

      - name: Resolve Agents artifact name
        id: agents_artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.components.agents.version' release-manifest.json)"
          name="PacToolkits-Agents-${RUNTIME}-${version}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "dir=_agents_artifacts/${name}" >> "$GITHUB_OUTPUT"

      - name: Download bundled Agents artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.agents_artifact.outputs.name }}
          path: ${{ steps.agents_artifact.outputs.dir }}

      - name: Bundle agents into desktop publish output
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/resolve-bundled-agents-source.sh
          source scripts/lib/resolve-bundled-agents-source.sh
          while IFS=$'\t' read -r bundle_id version exe_name install_dir; do
            [[ -n "$install_dir" ]] || { echo "Missing installDir for component $bundle_id" >&2; exit 1; }
            if [[ "$install_dir" == "." ]]; then
              agents_target_dir="_desktop_publish/Agents"
            else
              agents_target_dir="_desktop_publish/Agents/${install_dir}"
            fi
            source="$(resolve_bundled_agents_source "$exe_name" "$version" || true)"
            [[ -n "$source" ]] || {
              echo "Bundled Agents source missing for $bundle_id ($exe_name, version=$version, runtime=$RUNTIME)" >&2
              echo "Downloaded Agents artifact tree:" >&2
              find "_agents_artifacts" -type f 2>/dev/null | sed 's/^/  /' || echo "  (empty)" >&2
              exit 1
            }
            mkdir -p "$agents_target_dir"
            cp "$source" "$agents_target_dir/$exe_name"
            source_dir="$(dirname "$source")"
            [[ -f "$source_dir/ReleaseManifest.json" ]] || {
              echo "ERROR: missing Agents ReleaseManifest.json: $source_dir/ReleaseManifest.json" >&2
              exit 1
            }
            cp "$source_dir/ReleaseManifest.json" "$agents_target_dir/ReleaseManifest.json"
            if [[ -d "$source_dir/Modules" ]]; then
              mkdir -p "$agents_target_dir/Modules"
              cp -R "$source_dir/Modules/." "$agents_target_dir/Modules/"
              echo "Bundled $bundle_id modules -> Agents/Modules (from $source_dir/Modules)"
            fi
            echo "Bundled $bundle_id -> ${agents_target_dir#"_desktop_publish/"}/$exe_name (from $source)"
          done < <(jq -r '
            .components.agents as $agents |
            ["agents", $agents.version, $agents.entry["windows-x64"], ($agents.installDir // ".")] |
            @tsv
          ' release-manifest.json)

      - name: Pack with vpk
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/manifest-v2.sh
          source scripts/manifest-v2.sh
          mkdir -p "$RELEASES_DIR"
          [[ -f "_desktop_publish/$MAIN_EXE" ]] || {
            echo "Main executable missing in publish output: $MAIN_EXE" >&2
            exit 1
          }
          vpk [win] pack \
            --packId "$PACK_ID" \
            --packVersion "$PRODUCT_VERSION" \
            --packDir _desktop_publish \
            --outputDir "$RELEASES_DIR" \
            --mainExe "$MAIN_EXE" \
            --runtime "$RUNTIME" \
            --channel "$CHANNEL" \
            --packTitle PacToolkits \
            --packAuthors PacmanDoh \
            --noPortable \
            -i "$ICON_PATH"

      - name: Collect desktop release assets
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/resolve-bundled-agents-source.sh
          source scripts/lib/resolve-bundled-agents-source.sh
          dist="_desktop_release"
          mkdir -p "$dist"
          cp -R "$RELEASES_DIR"/. "$dist"/
          while IFS=$'\t' read -r version exe_name; do
            source="$(resolve_bundled_agents_source "$exe_name" "$version" || true)"
            [[ -n "$source" ]] || {
              echo "Bundled Agents source missing for collect step ($exe_name, version=$version)" >&2
              exit 1
            }
            # Host 依赖模块目录，发布时必须归档完整 Agents 布局；GitHub Release 上传仅接受文件
            agents_dist="$dist/Agents"
            mkdir -p "$agents_dist"
            cp "$source" "$agents_dist/$exe_name"
            source_dir="$(dirname "$source")"
            [[ -f "$source_dir/ReleaseManifest.json" ]] || {
              echo "ERROR: missing Agents ReleaseManifest.json: $source_dir/ReleaseManifest.json" >&2
              exit 1
            }
            cp "$source_dir/ReleaseManifest.json" "$agents_dist/ReleaseManifest.json"
            if [[ -d "$source_dir/Modules" ]]; then
              mkdir -p "$agents_dist/Modules"
              cp -R "$source_dir/Modules/." "$agents_dist/Modules/"
            fi
            agents_zip="$dist/PacToolkits-Agents-${RUNTIME}-${version}.zip"
            (cd "$dist" && zip -r "$(basename "$agents_zip")" Agents)
            rm -rf "$agents_dist"
            echo "Collected Agents zip -> $agents_zip"
          done < <(jq -r '
            .components.agents |
            [.version, .entry["windows-x64"]] |
            @tsv
          ' release-manifest.json)

      - name: Upload desktop release artifact
        uses: actions/upload-artifact@v7
        with:
          name: pactoolkits-desktop-${{ env.RUNTIME }}-${{ inputs.product_version }}
          path: _desktop_release/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days || 3 }}
