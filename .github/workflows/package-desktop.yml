name: Package Desktop

on:
  workflow_call:
    inputs:
      implementation:
        required: true
        type: string
      desktop_artifact_name:
        required: true
        type: string
      main_exe:
        required: true
        type: string
      icon_path:
        required: true
        type: string
      releases_dir:
        required: true
        type: string
      pack_id:
        required: true
        type: string
      product_version:
        required: true
        type: string
      desktop_version:
        required: true
        type: string
      channel:
        required: true
        type: string
      runtime:
        required: false
        type: string
        default: win-x64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package_desktop:
    name: Package Desktop (${{ inputs.implementation }})
    runs-on: ubuntu-latest
    env:
      VPK_CACHE_KEY: vpk-global-tool-v1
      IMPLEMENTATION: ${{ inputs.implementation }}
      DESKTOP_ARTIFACT_NAME: ${{ inputs.desktop_artifact_name }}
      MAIN_EXE: ${{ inputs.main_exe }}
      ICON_PATH: ${{ inputs.icon_path }}
      RELEASES_DIR: ${{ inputs.releases_dir }}
      PACK_ID: ${{ inputs.pack_id }}
      PRODUCT_VERSION: ${{ inputs.product_version }}
      DESKTOP_VERSION: ${{ inputs.desktop_version }}
      CHANNEL: ${{ inputs.channel }}
      RUNTIME: ${{ inputs.runtime || 'win-x64' }}
      AGENT_RUNTIME: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Add dotnet tools path
        shell: bash
        run: |
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Cache dotnet global tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.dotnet/tools
            ~/.dotnet/toolResolverCache
          key: ${{ runner.os }}-${{ env.VPK_CACHE_KEY }}-${{ hashFiles('.github/workflows/package-desktop.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.VPK_CACHE_KEY }}-

      - name: Install vpk
        shell: bash
        run: |
          set -euo pipefail
          command -v vpk >/dev/null 2>&1 || dotnet tool install -g vpk

      - name: Validate release plan inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$IMPLEMENTATION" in
            avalonia|electron) ;;
            *) echo "Unsupported implementation: $IMPLEMENTATION" >&2; exit 1 ;;
          esac
          case "$RUNTIME" in
            win-x64|win-arm64) ;;
            *) echo "Unsupported runtime: $RUNTIME" >&2; exit 1 ;;
          esac
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.(0|[1-9][0-9]*))?$'
          [[ "$PRODUCT_VERSION" =~ $semver_re ]] || { echo "Invalid product_version: $PRODUCT_VERSION" >&2; exit 1; }
          [[ "$DESKTOP_VERSION" =~ $semver_re ]] || { echo "Invalid desktop_version: $DESKTOP_VERSION" >&2; exit 1; }
          [[ -f "$ICON_PATH" ]] || { echo "Installer icon missing: $ICON_PATH" >&2; exit 1; }
          jq -e --arg implementation "$IMPLEMENTATION" '
            .components.desktop.implementation == $implementation and
            (.components.desktop.bundles | type == "array" and length > 0) and
            (
              . as $root |
              $root.components.desktop.bundles |
              all(
                . as $bundle |
                ($root.components[$bundle] != null) and
                ($root.components[$bundle].artifact["windows-x64"] | type == "string" and length > 0)
              )
            )
          ' release-manifest.json >/dev/null

      - name: Download desktop publish artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.desktop_artifact_name }}
          path: _desktop_publish

      - name: Download bundled agent artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pactoolkits-*-${{ env.AGENT_RUNTIME }}-*
          path: _agent_artifacts

      - name: Bundle agents into desktop publish output
        shell: bash
        run: |
          set -euo pipefail
          resolve_bundled_agent_source() {
            local exe_name="$1"
            local version="$2"
            local found=""
            found="$(
              find "_agent_artifacts" -path "*-${AGENT_RUNTIME}-${version}*" -name "$exe_name" -type f -print -quit 2>/dev/null || true
            )"
            if [[ -z "$found" ]]; then
              found="$(find "_agent_artifacts" -name "$exe_name" -type f -print -quit 2>/dev/null || true)"
            fi
            if [[ -n "$found" ]]; then
              printf '%s\n' "$found"
              return 0
            fi
            return 1
          }
          while IFS=$'\t' read -r bundle_id version exe_name install_dir; do
            [[ -n "$install_dir" ]] || { echo "Missing artifact.installDir for component $bundle_id" >&2; exit 1; }
            agent_target_dir="_desktop_publish/Agents/${install_dir}"
            source="$(resolve_bundled_agent_source "$exe_name" "$version" || true)"
            [[ -n "$source" ]] || {
              echo "Bundled agent source missing for $bundle_id ($exe_name, version=$version, runtime=$AGENT_RUNTIME)" >&2
              echo "Downloaded agent artifact tree:" >&2
              find "_agent_artifacts" -type f 2>/dev/null | sed 's/^/  /' || echo "  (empty)" >&2
              exit 1
            }
            mkdir -p "$agent_target_dir"
            cp "$source" "$agent_target_dir/$exe_name"
            echo "Bundled $bundle_id -> Agents/$install_dir/$exe_name (from $source)"
          done < <(jq -r '
            .components.desktop.bundles[] as $id |
            .components[$id] |
            [$id, .version, .artifact["windows-x64"], (.artifact.installDir // "")] |
            @tsv
          ' release-manifest.json)

      - name: Pack with vpk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASES_DIR"
          [[ -f "_desktop_publish/$MAIN_EXE" ]] || {
            echo "Main executable missing in publish output: $MAIN_EXE" >&2
            exit 1
          }
          vpk [win] pack \
            --packId "$PACK_ID" \
            --packVersion "$PRODUCT_VERSION" \
            --packDir _desktop_publish \
            --outputDir "$RELEASES_DIR" \
            --mainExe "$MAIN_EXE" \
            --runtime "$RUNTIME" \
            --channel "$CHANNEL" \
            --packTitle PacToolkits \
            --packAuthors pacmandoh \
            --noPortable \
            -i "$ICON_PATH"

      - name: Collect desktop release assets
        shell: bash
        run: |
          set -euo pipefail
          resolve_bundled_agent_source() {
            local exe_name="$1"
            local version="$2"
            local found=""
            found="$(
              find "_agent_artifacts" -path "*-${AGENT_RUNTIME}-${version}*" -name "$exe_name" -type f -print -quit 2>/dev/null || true
            )"
            if [[ -z "$found" ]]; then
              found="$(find "_agent_artifacts" -name "$exe_name" -type f -print -quit 2>/dev/null || true)"
            fi
            if [[ -n "$found" ]]; then
              printf '%s\n' "$found"
              return 0
            fi
            return 1
          }
          dist="_desktop_release"
          mkdir -p "$dist"
          cp -R "$RELEASES_DIR"/. "$dist"/
          while IFS=$'\t' read -r version exe_name; do
            source="$(resolve_bundled_agent_source "$exe_name" "$version" || true)"
            [[ -n "$source" ]] || {
              echo "Bundled agent source missing for collect step ($exe_name, version=$version)" >&2
              exit 1
            }
            cp "$source" "$dist/$exe_name"
          done < <(jq -r '
            .components.desktop.bundles[] as $id |
            .components[$id] |
            [.version, .artifact["windows-x64"]] |
            @tsv
          ' release-manifest.json)

      - name: Upload desktop release artifact
        uses: actions/upload-artifact@v7
        with:
          name: pactoolkits-desktop-${{ env.RUNTIME }}-${{ inputs.product_version }}
          path: _desktop_release/*
          if-no-files-found: error
