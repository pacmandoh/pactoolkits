name: Release Publish Assets

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_assets:
    name: Upload Release Assets and Sync Feed
    runs-on: ubuntu-latest
    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" != refs/tags/v* ]]; then
            echo "This job only supports tag refs like refs/tags/v*; got: ${GITHUB_REF:-<empty>}"
            exit 1
          fi
          if [ -z "${GITHUB_REF_NAME:-}" ]; then
            echo "GITHUB_REF_NAME is empty; this job must run on a tag ref."
            exit 1
          fi
          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

      - name: Prepare SSH for rsync
        env:
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
          FEED_SSH_KNOWN_HOSTS: ${{ secrets.FEED_SSH_KNOWN_HOSTS }}
          FEED_SSH_USER: ${{ secrets.FEED_SSH_USER }}
          FEED_SSH_HOST: ${{ secrets.FEED_SSH_HOST }}
          FEED_SSH_PORT: ${{ secrets.FEED_SSH_PORT }}
          FEED_RSYNC_PATH: ${{ secrets.FEED_RSYNC_PATH }}
        run: |
          set -euo pipefail
          required_vars=(FEED_SSH_KEY FEED_SSH_KNOWN_HOSTS FEED_SSH_USER FEED_SSH_HOST FEED_SSH_PORT FEED_RSYNC_PATH)
          for name in "${required_vars[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$FEED_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$FEED_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Validate key format without leaking key material.
          if grep -q '\\n' ~/.ssh/id_ed25519; then
            echo "KEY_HAS_LITERAL_BACKSLASH_N"
          fi
          if grep -q $'\r' ~/.ssh/id_ed25519; then
            echo "KEY_HAS_CRLF"
          fi
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null && echo "KEY_PARSE_OK" || (echo "KEY_PARSE_BAD"; exit 1)

      - name: Rsync release feed
        env:
          FEED_SSH_USER: ${{ secrets.FEED_SSH_USER }}
          FEED_SSH_HOST: ${{ secrets.FEED_SSH_HOST }}
          FEED_SSH_PORT: ${{ secrets.FEED_SSH_PORT }}
          FEED_RSYNC_PATH: ${{ secrets.FEED_RSYNC_PATH }}
        run: |
          set -euo pipefail
          ssh_rsh="ssh -i $HOME/.ssh/id_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p ${FEED_SSH_PORT}"

          # Preflight to fail fast on auth/network issues before rsync.
          if ! $ssh_rsh "${FEED_SSH_USER}@${FEED_SSH_HOST}" "echo ssh_ok" >/dev/null; then
            echo "SSH preflight failed."
            exit 1
          fi

          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "rsync attempt ${attempt}/${max_attempts}"
            if rsync -a --delete --timeout=60 --info=progress2,stats1 \
              --rsh "$ssh_rsh" \
              dist/ "${FEED_SSH_USER}@${FEED_SSH_HOST}:${FEED_RSYNC_PATH}/"; then
              echo "rsync succeeded."
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "rsync failed after ${max_attempts} attempts."
              exit 1
            fi

            backoff=$((attempt * 10))
            echo "rsync failed; retrying in ${backoff}s..."
            sleep "$backoff"
          done
