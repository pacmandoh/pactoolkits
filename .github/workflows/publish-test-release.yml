name: Publish Test Release

on:
  workflow_call:
    inputs:
      product_version:
        required: true
        type: string
      runtime:
        required: true
        type: string
      release_tag:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_test_release:
    name: Publish Test Release (${{ inputs.runtime }})
    runs-on: ubuntu-latest
    env:
      PRODUCT_VERSION: ${{ inputs.product_version }}
      RUNTIME: ${{ inputs.runtime }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate test release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "Refusing to publish test assets to formal release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^test-v ]]; then
            echo "Test release tag must start with test-v: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download desktop release artifact
        uses: actions/download-artifact@v8
        with:
          name: pactoolkits-desktop-${{ inputs.runtime }}-${{ inputs.product_version }}
          path: dist

      - name: Add release metadata
        run: cp release-manifest.json dist/release-manifest.json

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/*)
          if ((${#assets[@]} == 0)); then
            echo "No release assets found." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Updating existing test release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --target "${GITHUB_SHA}" \
              --title "PacToolkits ${PRODUCT_VERSION} test (${RUNTIME})" \
              --notes "Automated Windows test package from build-windows-test-package. This is not a formal release tag." \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          echo "Test release ready: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
