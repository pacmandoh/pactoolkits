name: Generate Release Notes

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_release_notes:
    name: Generate Release Notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      CHANGELOGITHUB_VERSION: 14.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate or update release notes
        run: |
          set -euo pipefail
          # 显式指定发布引用，避免同一提交上的 test-v* tag 影响 changelogen 版本解析
          PREV_V_TAG="$(git tag -l 'v*' --sort=-version:refname | grep -vx "${GITHUB_REF_NAME}" | head -1 || true)"
          ARGS=(--to "${GITHUB_REF_NAME}")
          if [[ -n "$PREV_V_TAG" ]]; then
            ARGS+=(--from "$PREV_V_TAG")
          fi
          npx --yes "changelogithub@${CHANGELOGITHUB_VERSION}" "${ARGS[@]}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Align GitHub release prerelease flag with channel
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/manifest-v2.sh
          # shellcheck source=manifest-v2.sh
          source scripts/manifest-v2.sh
          validate_manifest_v2 release-manifest.json
          channel="$(manifest_release_channel release-manifest.json)"
          case "$channel" in
            beta)
              gh release edit "${GITHUB_REF_NAME}" --prerelease
              ;;
            stable)
              gh release edit "${GITHUB_REF_NAME}" --prerelease=false
              ;;
            *)
              echo "Unsupported release channel: $channel"
              exit 1
              ;;
          esac
          actual="$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq .isPrerelease)"
          validate_release_prerelease_flag release-manifest.json "$actual"
