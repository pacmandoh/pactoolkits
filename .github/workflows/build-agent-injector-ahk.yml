name: Build Agent Injector AHK

on:
  workflow_call:
    inputs:
      runtime:
        required: false
        type: string
        default: win-x64
      artifact_retention_days:
        required: false
        type: number
        default: 3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_agent_injector_ahk:
    name: Build Agent Injector AHK
    runs-on: windows-latest
    env:
      RUNTIME: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read manifest agent version
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          $agentVersion = $manifest.components.'agent-injector-ahk'.version
          if ($agentVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid agent-injector-ahk version in release-manifest.json: $agentVersion"
          }
          "AGENT_VERSION=$agentVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache agent injector binary
        id: cache_agent_injector
        uses: actions/cache@v5
        with:
          path: ~\pactoolkits-injector-cache\${{ env.RUNTIME }}\pactoolkits-injector.exe
          key: ${{ runner.os }}-pactoolkits-injector-${{ env.RUNTIME }}-${{ hashFiles('release-manifest.json', 'runtime/agents/injector-ahk/main.ahk', 'runtime/agents/injector-ahk/src/**/*.ahk', 'runtime/agents/injector-ahk/assets/pactoolkits-injector.ico', 'runtime/agents/injector-ahk/assets/pactoolkits-agent-injector-ahk.ico', '.github/workflows/build-agent-injector-ahk.yml') }}

      - name: Report agent cache status
        shell: pwsh
        run: |
          Write-Host "cache.agent-injector-ahk.hit=${{ steps.cache_agent_injector.outputs.cache-hit }}"

      - name: Restore cached agent binary
        if: steps.cache_agent_injector.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $cachedExe = Join-Path $env:USERPROFILE "pactoolkits-injector-cache\$env:RUNTIME\pactoolkits-injector.exe"
          if (-not (Test-Path $cachedExe)) {
            throw "cache-hit=true but cached agent binary is missing: $cachedExe"
          }
          $stagingDir = "artifacts/agents/agent-injector-ahk/$env:RUNTIME"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item $cachedExe (Join-Path $stagingDir "pactoolkits-injector.exe") -Force

      - name: Install AutoHotkey
        if: steps.cache_agent_injector.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $baseCandidates = @(
            "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe",
            "C:\Program Files\AutoHotkey\AutoHotkey64.exe"
          )
          if (-not ($baseCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install autohotkey --version=2.0.19 --no-progress -y
          }

      - name: Cache Ahk2Exe asset
        if: steps.cache_agent_injector.outputs.cache-hit != 'true'
        id: cache_ahk2exe
        uses: actions/cache@v5
        with:
          path: ~\ahk2exe-cache
          key: ${{ runner.os }}-ahk2exe-asset-v1-${{ hashFiles('.github/workflows/build-agent-injector-ahk.yml') }}
          restore-keys: |
            ${{ runner.os }}-ahk2exe-asset-v1-

      - name: Resolve Ahk2Exe compiler
        if: steps.cache_agent_injector.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ahkBase = "C:\Program Files\AutoHotkey"
          function Test-PeExecutable {
            param([string]$Path)
            if (-not (Test-Path $Path)) { return $false }
            if ([System.IO.Path]::GetExtension($Path) -ne '.exe') { return $false }
            try {
              $bytes = [System.IO.File]::ReadAllBytes($Path)
              if ($bytes.Length -lt 0x40) { return $false }
              if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { return $false }
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              return $peOffset -gt 0 -and ($peOffset + 6) -lt $bytes.Length
            } catch {
              return $false
            }
          }

          function Find-AhkBase {
            $directCandidates = @(
              (Join-Path $ahkBase "v2\AutoHotkey64.exe"),
              (Join-Path $ahkBase "AutoHotkey64.exe"),
              (Join-Path $ahkBase "Compiler\AutoHotkey64.exe"),
              (Join-Path $ahkBase "Compiler\Base Files\AutoHotkey64.exe")
            )
            $base = $directCandidates | Where-Object { Test-PeExecutable $_ } | Select-Object -First 1
            if ($base) { return $base }
            Get-ChildItem -Path $ahkBase -Recurse -File -Filter "AutoHotkey64.exe" -ErrorAction SilentlyContinue |
              Where-Object { Test-PeExecutable $_.FullName } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          $compilerPath = Join-Path (Join-Path $ahkBase "Compiler") "Ahk2Exe.exe"
          $cacheRoot = Join-Path $env:USERPROFILE "ahk2exe-cache"
          $cachedCompiler = Join-Path $cacheRoot "Ahk2Exe.exe"
          if (-not (Test-Path $compilerPath) -and (Test-Path $cachedCompiler)) {
            $compilerTargetDir = Join-Path $ahkBase "Compiler"
            New-Item -ItemType Directory -Force -Path $compilerTargetDir | Out-Null
            Copy-Item -Path (Join-Path $cacheRoot "*") -Destination $compilerTargetDir -Recurse -Force
          }
          if (Test-Path $compilerPath) {
            $baseExe = Find-AhkBase
            if (-not $baseExe) { throw "AutoHotkey base executable not found for runtime=$env:RUNTIME." }
            "AHK2EXE_PATH=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "AHK_BASE_PATH=$baseExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          $api = "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "Ahk2Exe*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No Ahk2Exe zip asset found." }

          $stageRoot = Join-Path $env:RUNNER_TEMP "ahk2exe-stage"
          $zipPath = Join-Path $stageRoot "Ahk2Exe.zip"
          $extractRoot = Join-Path $stageRoot "extract"
          if (Test-Path $stageRoot) { Remove-Item -Path $stageRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          Invoke-WebRequest -Uri $asset.url -Headers @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/octet-stream"
          } -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force

          $compilerSource = Get-ChildItem -Path $extractRoot -Recurse -File -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compilerSource) {
            throw "Downloaded Ahk2Exe asset but Ahk2Exe.exe was not found in extracted contents."
          }

          $compilerTargetDir = Join-Path $ahkBase "Compiler"
          if (Test-Path $compilerTargetDir) { Remove-Item -Path $compilerTargetDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $compilerTargetDir | Out-Null
          Copy-Item -Path (Join-Path $extractRoot "*") -Destination $compilerTargetDir -Recurse -Force
          $compilerPath = Join-Path $compilerTargetDir "Ahk2Exe.exe"
          if (-not (Test-Path $compilerPath)) { throw "Ahk2Exe deploy failed: $compilerPath not found after copy." }
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          Copy-Item -Path (Join-Path $compilerTargetDir "*") -Destination $cacheRoot -Recurse -Force
          $baseExe = Find-AhkBase
          if (-not $baseExe) { throw "AutoHotkey base executable not found for runtime=$env:RUNTIME." }
          "AHK2EXE_PATH=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AHK_BASE_PATH=$baseExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile agent injector AHK
        if: steps.cache_agent_injector.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Compiling pactoolkits-injector.exe from release-manifest agentVersion=$env:AGENT_VERSION"
          $agentVersion4 = "$env:AGENT_VERSION.0"
          $compiler = $env:AHK2EXE_PATH
          $baseExe = $env:AHK_BASE_PATH
          if (-not (Test-Path $compiler)) { throw "Ahk2Exe.exe not found: $compiler" }
          if (-not $baseExe) { throw "AutoHotkey base executable not found under C:\Program Files\AutoHotkey." }

          $workspace = $env:GITHUB_WORKSPACE
          $agentDirPath = (Resolve-Path (Join-Path $workspace "runtime/agents/injector-ahk")).Path
          $mainScript = Join-Path $agentDirPath "main.ahk"
          if (-not (Test-Path $mainScript)) { throw "AHK entry script not found: $mainScript" }
          $entryPath = Join-Path $agentDirPath "__ci_compile_entry__.ahk"
          $stagingDir = Join-Path $workspace "artifacts/agents/agent-injector-ahk/$env:RUNTIME"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $outExe = Join-Path $stagingDir "pactoolkits-injector.exe"
          $iconCandidates = @(
            (Join-Path $agentDirPath "assets/pactoolkits-injector.ico"),
            (Join-Path $agentDirPath "assets/pactoolkits-agent-injector-ahk.ico")
          )
          $iconPath = $iconCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iconPath) { throw "Agent icon not found under runtime/agents/injector-ahk/assets" }
          $entryLines = @(
            "; CI-only wrapper script for Ahk2Exe directives.",
            ";@Ahk2Exe-Set Version, $agentVersion4",
            ";@Ahk2Exe-Set FileVersion, $agentVersion4",
            ";@Ahk2Exe-Set ProductVersion, $agentVersion4",
            ";@Ahk2Exe-Set ProductName, PacToolkits Injector",
            ";@Ahk2Exe-Set CompanyName, pacmandoh",
            ";@Ahk2Exe-Set FileDescription, PacToolkits automation injector",
            ";@Ahk2Exe-Set InternalName, pactoolkits-injector",
            ";@Ahk2Exe-Set OriginalFilename, pactoolkits-injector.exe",
            ('#Include "{0}"' -f $mainScript)
          )
          Set-Content -Path $entryPath -Value $entryLines -Encoding utf8
          $compilerDir = Split-Path -Path $compiler -Parent
          try {
            Remove-Item -Path $outExe -Force -ErrorAction SilentlyContinue
            $argLine = @(
              ('/in "{0}"' -f $entryPath),
              ('/out "{0}"' -f $outExe),
              ('/icon "{0}"' -f $iconPath),
              ('/base "{0}"' -f $baseExe),
              '/silent'
            ) -join " "
            Write-Host ("Ahk2Exe args: " + $argLine)
            Write-Host ("Ahk2Exe working directory: " + $compilerDir)
            Write-Host ("Expected output: " + $outExe)
            # Ahk2Exe is a GUI tool: use /silent for headless CI and absolute /out (main uses workspace paths).
            $proc = Start-Process -FilePath $compiler -ArgumentList $argLine -WorkingDirectory $compilerDir -PassThru -Wait
            if ($null -ne $proc.ExitCode -and $proc.ExitCode -ne 0) {
              throw "Ahk2Exe exited with code $($proc.ExitCode)"
            }
          }
          finally {
            if (Test-Path $entryPath) { Remove-Item $entryPath -Force }
          }
          if (-not (Test-Path $outExe)) {
            Write-Host "Compiler directory contents for diagnosis:"
            Get-ChildItem -Path $compilerDir -Force | Select-Object Name, Length, Mode | Format-Table -AutoSize | Out-String | Write-Host
            throw "Agent compile output missing: $outExe"
          }
          $cacheDir = Join-Path $env:USERPROFILE "pactoolkits-injector-cache\$env:RUNTIME"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          Copy-Item $outExe (Join-Path $cacheDir "pactoolkits-injector.exe") -Force
          Write-Host "Cached pactoolkits-injector.exe for future runs."

      - name: Validate agent binary
        shell: pwsh
        run: |
          $outExe = "artifacts/agents/agent-injector-ahk/$env:RUNTIME/pactoolkits-injector.exe"
          $agentVersion4 = "$env:AGENT_VERSION.0"
          if (-not (Test-Path $outExe)) { throw "Agent binary missing: $outExe" }

          $bytes = [System.IO.File]::ReadAllBytes($outExe)
          if ($bytes.Length -lt 0x40) {
            throw "Agent binary too small to be a valid PE file: $outExe"
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -le 0 -or ($peOffset + 6) -ge $bytes.Length) {
            throw "Invalid PE header offset in agent binary: $outExe"
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Agent binary is not x64. PE Machine=0x{0:X4}" -f $machine)
          }

          $fileVersion = (Get-Item $outExe).VersionInfo.FileVersion
          $productVersion = (Get-Item $outExe).VersionInfo.ProductVersion
          if ($fileVersion -ne $agentVersion4) {
            throw "FileVersion mismatch. expected=$agentVersion4 actual=$fileVersion"
          }
          if ($productVersion -ne $agentVersion4) {
            throw "ProductVersion mismatch. expected=$agentVersion4 actual=$productVersion"
          }

      - name: Upload agent artifact
        uses: actions/upload-artifact@v7
        with:
          name: pactoolkits-injector-${{ env.RUNTIME }}-${{ env.AGENT_VERSION }}
          path: artifacts/agents/agent-injector-ahk/${{ env.RUNTIME }}/pactoolkits-injector.exe
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days || 3 }}
