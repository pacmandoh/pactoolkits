name: Validate Release

on:
  pull_request:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only; do not authorize a formal release
        required: true
        type: boolean
        default: true
      confirm:
        description: Required for a formal release
        required: true
        type: boolean
        default: false
      allow_beta_db_change:
        description: Explicitly authorize Beta database changes
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: true
      confirm:
        required: false
        type: boolean
        default: false
      allow_beta_db_change:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve validation inputs
        id: inputs
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
          INPUT_ALLOW_BETA_DB_CHANGE: ${{ inputs.allow_beta_db_change }}
        run: |
          set -euo pipefail
          dry_run="${INPUT_DRY_RUN:-true}"
          confirm="${INPUT_CONFIRM:-false}"
          allow_beta_db_change="${INPUT_ALLOW_BETA_DB_CHANGE:-false}"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "confirm=$confirm" >> "$GITHUB_OUTPUT"
          echo "allow_beta_db_change=$allow_beta_db_change" >> "$GITHUB_OUTPUT"

      - name: Validate release channel
        shell: bash
        env:
          DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
          CONFIRM: ${{ steps.inputs.outputs.confirm }}
        run: |
          set -euo pipefail
          chmod +x scripts/validate-release-channel.sh scripts/validate-database-policy.sh
          channel="$(jq -r '.release.channel' release-manifest.json)"
          tag=""
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          prerelease="$(jq -r 'if .release.channel == "beta" then "true" else "false" end' release-manifest.json)"
          scripts/validate-release-channel.sh \
            --manifest release-manifest.json \
            --tag "$tag" \
            --prerelease "$prerelease" \
            --feed-root /feed/pactoolkits \
            --feed-target "/feed/pactoolkits/$channel" \
            --dry-run "$DRY_RUN" \
            --confirm "$CONFIRM"

      - name: Validate database policy
        shell: bash
        env:
          ALLOW_BETA_DB_CHANGE: ${{ steps.inputs.outputs.allow_beta_db_change }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/beta:refs/remotes/origin/beta
          base_ref="origin/main"
          scripts/validate-database-policy.sh \
            --manifest release-manifest.json \
            --base-ref "$base_ref" \
            --allow-beta-db-change "$ALLOW_BETA_DB_CHANGE"
