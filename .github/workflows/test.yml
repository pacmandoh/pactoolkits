name: Test

on:
  push:
    branches:
      - main
      - master
      - beta
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup shfmt
        run: |
          set -euo pipefail
          curl -sSLo "$RUNNER_TEMP/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64"
          chmod +x "$RUNNER_TEMP/shfmt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore PacToolkits.sln

      - name: Check format
        run: |
          set -euo pipefail
          chmod +x scripts/check-format.sh
          ./scripts/check-format.sh

  tooling_tests:
    name: Tooling Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tooling tests
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh tests/scripts/*.sh
          ./tests/scripts/run-tooling-tests.sh

  dotnet_tests:
    name: .NET Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PacToolkits.sln

      - name: Test
        run: dotnet test PacToolkits.sln -c Release --no-restore --verbosity minimal --filter "Category!=PostgresIntegration"
