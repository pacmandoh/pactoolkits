name: Test

on:
  push:
    branches:
      - main
      - master
      - beta
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup shfmt
        run: |
          set -euo pipefail
          curl -sSLo "$RUNNER_TEMP/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64"
          chmod +x "$RUNNER_TEMP/shfmt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore PacToolkits.sln --locked-mode

      - name: Check format
        run: |
          set -euo pipefail
          chmod +x scripts/check-format.sh
          ./scripts/check-format.sh

  tooling_tests:
    name: Tooling Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tooling tests
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh tests/scripts/*.sh
          ./tests/scripts/run-tooling-tests.sh

  dotnet_tests:
    name: .NET Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PacToolkits.sln --locked-mode

      - name: Unit tests
        run: |
          set -euo pipefail
          dotnet test tests/PacToolkits.Agents.Contracts.Tests/PacToolkits.Agents.Contracts.Tests.csproj -c Release --no-restore --verbosity minimal
          dotnet test tests/PacToolkits.Desktop.Tests/PacToolkits.Desktop.Tests.csproj -c Release --no-restore --verbosity minimal --filter "Category!=PostgresIntegration"

  ui_headless_tests:
    name: Headless UI Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PacToolkits.sln --locked-mode

      - name: Headless UI tests
        run: dotnet test tests/PacToolkits.Desktop.UiTests/PacToolkits.Desktop.UiTests.csproj -c Release --no-restore --verbosity minimal
