name: Build Test Package

on:
  push:
    branches:
      - beta
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
    paths:
      - 'release-manifest.json'
      - 'apps/api-asp/**'
      - 'apps/desktop-avalonia/**'
      - 'packages/**'
      - 'runtime/agents/**'
      - '.github/workflows/build-test-package.yml'
      - '.github/workflows/build-agents.yml'
      - '.github/workflows/build-api.yml'
      - '.github/workflows/build-desktop-avalonia.yml'
      - '.github/workflows/package-desktop.yml'
      - '.github/workflows/publish-release.yml'
      - '.github/workflows/resolve-release-plan.yml'
      - 'PacToolkits.sln'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-package-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve_release_plan:
    uses: ./.github/workflows/resolve-release-plan.yml

  build_agents:
    needs:
      - resolve_release_plan
    uses: ./.github/workflows/build-agents.yml
    with:
      artifact_retention_days: 1
    secrets: inherit

  build_desktop_avalonia:
    needs:
      - resolve_release_plan
    uses: ./.github/workflows/build-desktop-avalonia.yml
    with:
      artifact_retention_days: 1
    secrets: inherit

  build_api:
    needs:
      - resolve_release_plan
    uses: ./.github/workflows/build-api.yml
    with:
      artifact_retention_days: 1

  package_desktop:
    needs:
      - resolve_release_plan
      - build_agents
      - build_desktop_avalonia
    if: |
      always() &&
      needs.resolve_release_plan.result == 'success' &&
      needs.build_agents.result == 'success' &&
      needs.build_desktop_avalonia.result == 'success'
    uses: ./.github/workflows/package-desktop.yml
    with:
      desktop_artifact_name: ${{ needs.resolve_release_plan.outputs.desktop_artifact_name }}
      main_exe: ${{ needs.resolve_release_plan.outputs.main_exe }}
      icon_path: ${{ needs.resolve_release_plan.outputs.icon_path }}
      releases_dir: ${{ needs.resolve_release_plan.outputs.releases_dir }}
      pack_id: ${{ needs.resolve_release_plan.outputs.pack_id }}
      product_version: ${{ needs.resolve_release_plan.outputs.product_version }}
      desktop_version: ${{ needs.resolve_release_plan.outputs.desktop_version }}
      channel: ${{ needs.resolve_release_plan.outputs.channel }}
      artifact_retention_days: 1
    secrets: inherit

  publish_test_release:
    needs:
      - resolve_release_plan
      - package_desktop
      - build_api
    if: needs.package_desktop.result == 'success' && needs.build_api.result == 'success'
    uses: ./.github/workflows/publish-release.yml
    with:
      product_version: ${{ needs.resolve_release_plan.outputs.product_version }}
      desktop_version: ${{ needs.resolve_release_plan.outputs.desktop_version }}
      api_version: ${{ needs.resolve_release_plan.outputs.api_version }}
      agents_version: ${{ needs.resolve_release_plan.outputs.agents_version }}
      channel: ${{ needs.resolve_release_plan.outputs.channel }}
      release_tag: test-v${{ needs.resolve_release_plan.outputs.product_version }}-win-x64
      test_release: true
    secrets: inherit
