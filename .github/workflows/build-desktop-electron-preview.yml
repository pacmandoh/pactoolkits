name: Build Desktop Electron Preview

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_desktop_electron_preview:
    name: Build Desktop Electron Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read release manifest
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=manifest-v2.sh
          source scripts/manifest-v2.sh
          validate_manifest_v2 release-manifest.json
          echo "PRODUCT_VERSION=$(manifest_product_version release-manifest.json)" >> "$GITHUB_ENV"

      - name: Build electron preview bundle
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/build-electron-preview.sh

      - name: Upload electron preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: pactoolkits-desktop-electron-preview-win-x64-${{ env.PRODUCT_VERSION }}
          path: artifacts/desktop/electron-preview/win-x64/*
          if-no-files-found: error
