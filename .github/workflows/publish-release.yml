name: Publish Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_release:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read release manifest
        run: |
          set -euo pipefail
          # shellcheck source=manifest-v2.sh
          source scripts/manifest-v2.sh
          validate_manifest_v2 release-manifest.json
          channel="$(manifest_release_channel release-manifest.json)"
          product_version="$(manifest_product_version release-manifest.json)"
          migration_policy="$(manifest_database_migration_policy release-manifest.json)"
          prerelease="$(expected_release_prerelease release-manifest.json)"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            validate_release_tag_matches_product_version "${GITHUB_REF_NAME:-}" release-manifest.json
          fi
          case "$channel" in
            stable|beta) ;;
            *) echo "Unsupported release channel: ${channel:-<empty>}"; exit 1 ;;
          esac
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "PRODUCT_VERSION=$product_version" >> "$GITHUB_ENV"
          echo "MIGRATION_POLICY=$migration_policy" >> "$GITHUB_ENV"
          echo "EXPECTED_PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "Release plan: channel=$channel version=$product_version migrationPolicy=$migration_policy desktop=$(manifest_desktop_implementation release-manifest.json)"

      - name: Download desktop release artifact
        uses: actions/download-artifact@v8
        with:
          name: pactoolkits-desktop-win-x64-${{ env.PRODUCT_VERSION }}
          path: dist

      - name: Add channel release metadata
        run: cp release-manifest.json dist/release-manifest.json

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" != refs/tags/v* ]]; then
            echo "This job only supports tag refs like refs/tags/v*; got: ${GITHUB_REF:-<empty>}"
            exit 1
          fi
          shopt -s nullglob
          assets=(dist/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber

      - name: Prepare SSH for rsync
        env:
          FEED_SSH_KEY: ${{ secrets.FEED_SSH_KEY }}
          FEED_SSH_KNOWN_HOSTS: ${{ secrets.FEED_SSH_KNOWN_HOSTS }}
          FEED_SSH_USER: ${{ secrets.FEED_SSH_USER }}
          FEED_SSH_HOST: ${{ secrets.FEED_SSH_HOST }}
          FEED_SSH_PORT: ${{ secrets.FEED_SSH_PORT }}
          FEED_RSYNC_PATH: ${{ secrets.FEED_RSYNC_PATH }}
        run: |
          set -euo pipefail
          required_vars=(FEED_SSH_KEY FEED_SSH_KNOWN_HOSTS FEED_SSH_USER FEED_SSH_HOST FEED_SSH_PORT FEED_RSYNC_PATH)
          for name in "${required_vars[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$FEED_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$FEED_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Rsync release feed
        env:
          FEED_SSH_USER: ${{ secrets.FEED_SSH_USER }}
          FEED_SSH_HOST: ${{ secrets.FEED_SSH_HOST }}
          FEED_SSH_PORT: ${{ secrets.FEED_SSH_PORT }}
          FEED_RSYNC_PATH: ${{ secrets.FEED_RSYNC_PATH }}
        run: |
          set -euo pipefail
          ssh_rsh="ssh -i $HOME/.ssh/id_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=10 -p ${FEED_SSH_PORT}"
          target_path="${FEED_RSYNC_PATH%/}/${RELEASE_CHANNEL}"
          scripts/validate-release-channel.sh \
            --manifest release-manifest.json \
            --tag "${GITHUB_REF_NAME}" \
            --prerelease "${EXPECTED_PRERELEASE}" \
            --feed-root "${FEED_RSYNC_PATH%/}" \
            --feed-target "$target_path" \
            --dry-run false \
            --confirm true
          $ssh_rsh "${FEED_SSH_USER}@${FEED_SSH_HOST}" "mkdir -p '${target_path}'"
          rsync -a --delete --timeout=60 --rsh "$ssh_rsh" dist/ "${FEED_SSH_USER}@${FEED_SSH_HOST}:${target_path}/"
