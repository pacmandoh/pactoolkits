name: Release Build Agent

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_ahk:
    name: Build AHK Agent EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AutoHotkey
        shell: pwsh
        run: choco install autohotkey --no-progress -y

      - name: Resolve Ahk2Exe compiler
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ahkBase = "C:\Program Files\AutoHotkey"
          $ahk64Candidates = @(
            (Join-Path $ahkBase "v2\AutoHotkey64.exe"),
            (Join-Path $ahkBase "AutoHotkey64.exe")
          )
          $ahk64 = $ahk64Candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ahk64) {
            throw "AutoHotkey64.exe not found under C:\Program Files\AutoHotkey."
          }
          "AHK64_PATH=$ahk64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $api = "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $release.assets |
            Where-Object { $_.name -like "Ahk2Exe*.zip" } |
            Select-Object -First 1
          if (-not $asset) {
            $assetNames = ($release.assets | Select-Object -ExpandProperty name) -join ", "
            throw "No Ahk2Exe zip asset found in latest release. assets=[$assetNames]"
          }
          Write-Host "Using Ahk2Exe asset: $($asset.name)"

          $stageRoot = Join-Path $env:RUNNER_TEMP "ahk2exe-stage"
          $zipPath = Join-Path $stageRoot "Ahk2Exe.zip"
          $extractRoot = Join-Path $stageRoot "extract"
          if (Test-Path $stageRoot) {
            Remove-Item -Path $stageRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          Invoke-WebRequest -Uri $asset.url -Headers @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/octet-stream"
          } -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force

          $compilerSource = Get-ChildItem -Path $extractRoot -Recurse -File -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compilerSource) {
            throw "Downloaded Ahk2Exe asset but Ahk2Exe.exe was not found in extracted contents."
          }

          $compilerTargetDir = Join-Path $ahkBase "Compiler"
          if (Test-Path $compilerTargetDir) {
            Remove-Item -Path $compilerTargetDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $compilerTargetDir | Out-Null
          Copy-Item -Path (Join-Path $extractRoot "*") -Destination $compilerTargetDir -Recurse -Force

          $compilerPath = Join-Path $compilerTargetDir "Ahk2Exe.exe"
          if (-not (Test-Path $compilerPath)) {
            throw "Ahk2Exe deploy failed: $compilerPath not found after copy."
          }
          "AHK2EXE_PATH=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Ahk2Exe deployed to: $compilerTargetDir"

      - name: Read manifest agent version
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.agentVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid agentVersion in release-manifest.json: $($manifest.agentVersion)"
          }
          "AGENT_VERSION=$($manifest.agentVersion)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile AHK agent exe
        shell: pwsh
        run: |
          Write-Host "Compiling pacinjector.exe from release-manifest agentVersion=$env:AGENT_VERSION"
          $agentVersion4 = "$env:AGENT_VERSION.0"
          $compiler = $env:AHK2EXE_PATH
          $base64 = $env:AHK64_PATH
          if (-not (Test-Path $compiler)) {
            throw "Ahk2Exe.exe not found: $compiler"
          }
          if (-not $base64) {
            throw "AutoHotkey64.exe not found under C:\Program Files\AutoHotkey."
          }

          $toolsDir = "pactoolkits-ui/Tools"
          New-Item -ItemType Directory -Path $toolsDir -Force | Out-Null
          $workspace = $env:GITHUB_WORKSPACE
          $agentDirPath = (Resolve-Path "pactoolkits-agent").Path
          $mainScript = Join-Path $agentDirPath "main.ahk"
          if (-not (Test-Path $mainScript)) {
            throw "AHK entry script not found: $mainScript"
          }
          $entryPath = Join-Path $agentDirPath "__ci_compile_entry__.ahk"
          $entryLines = @(
            "; CI-only wrapper script for Ahk2Exe directives.",
            ";@Ahk2Exe-SetProp FileVersion, $agentVersion4",
            ";@Ahk2Exe-SetProp ProductVersion, $agentVersion4",
            ";@Ahk2Exe-SetProp Version, $agentVersion4",
            ('#Include "{0}"' -f $mainScript)
          )
          Set-Content -Path $entryPath -Value $entryLines -Encoding utf8

          $outExe = Join-Path (Join-Path (Join-Path $workspace "pactoolkits-ui") "Tools") "pacinjector.exe"
          $iconPath = Join-Path (Join-Path (Join-Path $workspace "pactoolkits-agent") "assets") "pacinjection.ico"
          $compilerDir = Split-Path -Path $compiler -Parent
          try {
            Remove-Item -Path $outExe -Force -ErrorAction SilentlyContinue

            $args = @(
              "/in", $entryPath,
              "/out", $outExe,
              "/icon", $iconPath,
              "/base", $base64
            )
            Write-Host ("Ahk2Exe args: " + ($args -join " "))

            Push-Location $compilerDir
            & $compiler @args
            $exitCode = $LASTEXITCODE
            Pop-Location
            if ($null -ne $exitCode -and $exitCode -ne 0) {
              throw "Ahk2Exe exited with code $exitCode"
            }
          }
          finally {
            try {
              if ((Get-Location).Path -eq $compilerDir) {
                Pop-Location
              }
            } catch {}
            if (Test-Path $entryPath) {
              Remove-Item $entryPath -Force
            }
          }

          if (-not (Test-Path $outExe)) {
            Write-Host "Compiler directory contents for diagnosis:"
            Get-ChildItem -Path $compilerDir -Force | Select-Object Name, Length, Mode | Format-Table -AutoSize | Out-String | Write-Host
            throw "AHK compile output missing: $outExe"
          }

          $bytes = [System.IO.File]::ReadAllBytes($outExe)
          if ($bytes.Length -lt 0x40) {
            throw "Compiled exe is too small to be a valid PE file."
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -le 0 -or ($peOffset + 6) -ge $bytes.Length) {
            throw "Invalid PE header offset in compiled exe."
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Compiled exe is not x64. PE Machine=0x{0:X4}" -f $machine)
          }

          $fileVersion = (Get-Item $outExe).VersionInfo.FileVersion
          $productVersion = (Get-Item $outExe).VersionInfo.ProductVersion
          if ($fileVersion -ne $agentVersion4) {
            throw "FileVersion mismatch. expected=$agentVersion4 actual=$fileVersion"
          }
          if ($productVersion -ne $agentVersion4) {
            throw "ProductVersion mismatch. expected=$agentVersion4 actual=$productVersion"
          }

      - name: Upload AHK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahk-agent-exe
          path: pactoolkits-ui/Tools/pacinjector.exe
          if-no-files-found: error
