name: Build Agents

on:
  workflow_call:
    inputs:
      runtime:
        required: false
        type: string
        default: win-x64
      artifact_retention_days:
        required: false
        type: number
        default: 3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_agents:
    name: Build Agents host and Injector
    runs-on: windows-latest
    env:
      RUNTIME: ${{ inputs.runtime || 'win-x64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read manifest agents version
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          $agentsVersion = $manifest.components.'agents'.version
          if ($agentsVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid agents version in release-manifest.json: $agentsVersion"
          }
          $injectorVersion = $manifest.components.'agents'.modules.Injector.version
          if ($injectorVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid agents.modules.Injector.version in release-manifest.json: $injectorVersion"
          }
          "AGENTS_VERSION=$agentsVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INJECTOR_MODULE_VERSION=$injectorVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync Injector module.json version from manifest
        shell: pwsh
        run: |
          $moduleJsonPath = "runtime/agents/modules/injector/module.json"
          if (-not (Test-Path $moduleJsonPath)) {
            throw "missing module.json: $moduleJsonPath"
          }
          $module = Get-Content $moduleJsonPath -Raw | ConvertFrom-Json
          $module.version = $env:INJECTOR_MODULE_VERSION
          $module | ConvertTo-Json -Depth 20 | Set-Content -Path $moduleJsonPath -Encoding utf8
          Write-Host "Synced module.json version=$($module.version)"

      - name: Cache injector module binary
        id: cache_injector_module
        uses: actions/cache@v5
        with:
          path: ~\PacToolkits-Agents-cache\${{ env.RUNTIME }}\Injector.exe
          key: ${{ runner.os }}-pactoolkits-agents-injector-module-${{ env.RUNTIME }}-${{ hashFiles('release-manifest.json', 'runtime/agents/modules/injector/main.ahk', 'runtime/agents/modules/injector/src/**/*.ahk', '.github/workflows/build-agents.yml') }}

      - name: Report Injector cache status
        shell: pwsh
        run: |
          Write-Host "cache.injector.hit=${{ steps.cache_injector_module.outputs.cache-hit }}"

      - name: Install AutoHotkey
        if: steps.cache_injector_module.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $baseCandidates = @(
            "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe",
            "C:\Program Files\AutoHotkey\AutoHotkey64.exe"
          )
          if (-not ($baseCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install autohotkey --version=2.0.19 --no-progress -y
          }

      - name: Cache Ahk2Exe asset
        if: steps.cache_injector_module.outputs.cache-hit != 'true'
        id: cache_ahk2exe
        uses: actions/cache@v5
        with:
          path: ~\ahk2exe-cache
          key: ${{ runner.os }}-ahk2exe-asset-v1-${{ hashFiles('.github/workflows/build-agents.yml') }}
          restore-keys: |
            ${{ runner.os }}-ahk2exe-asset-v1-

      - name: Resolve Ahk2Exe compiler
        if: steps.cache_injector_module.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ahkBase = "C:\Program Files\AutoHotkey"
          function Test-PeExecutable {
            param([string]$Path)
            if (-not (Test-Path $Path)) { return $false }
            if ([System.IO.Path]::GetExtension($Path) -ne '.exe') { return $false }
            try {
              $bytes = [System.IO.File]::ReadAllBytes($Path)
              if ($bytes.Length -lt 0x40) { return $false }
              if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { return $false }
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              return $peOffset -gt 0 -and ($peOffset + 6) -lt $bytes.Length
            } catch {
              return $false
            }
          }

          function Find-AhkBase {
            $directCandidates = @(
              (Join-Path $ahkBase "v2\AutoHotkey64.exe"),
              (Join-Path $ahkBase "AutoHotkey64.exe"),
              (Join-Path $ahkBase "Compiler\AutoHotkey64.exe"),
              (Join-Path $ahkBase "Compiler\Base Files\AutoHotkey64.exe")
            )
            $base = $directCandidates | Where-Object { Test-PeExecutable $_ } | Select-Object -First 1
            if ($base) { return $base }
            Get-ChildItem -Path $ahkBase -Recurse -File -Filter "AutoHotkey64.exe" -ErrorAction SilentlyContinue |
              Where-Object { Test-PeExecutable $_.FullName } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          $compilerPath = Join-Path (Join-Path $ahkBase "Compiler") "Ahk2Exe.exe"
          $cacheRoot = Join-Path $env:USERPROFILE "ahk2exe-cache"
          $cachedCompiler = Join-Path $cacheRoot "Ahk2Exe.exe"
          if (-not (Test-Path $compilerPath) -and (Test-Path $cachedCompiler)) {
            $compilerTargetDir = Join-Path $ahkBase "Compiler"
            New-Item -ItemType Directory -Force -Path $compilerTargetDir | Out-Null
            Copy-Item -Path (Join-Path $cacheRoot "*") -Destination $compilerTargetDir -Recurse -Force
          }
          if (Test-Path $compilerPath) {
            $baseExe = Find-AhkBase
            if (-not $baseExe) { throw "AutoHotkey base executable not found for runtime=$env:RUNTIME." }
            "AHK2EXE_PATH=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "AHK_BASE_PATH=$baseExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          $api = "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest"
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "Ahk2Exe*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No Ahk2Exe zip asset found." }

          $stageRoot = Join-Path $env:RUNNER_TEMP "ahk2exe-stage"
          $zipPath = Join-Path $stageRoot "Ahk2Exe.zip"
          $extractRoot = Join-Path $stageRoot "extract"
          if (Test-Path $stageRoot) { Remove-Item -Path $stageRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          Invoke-WebRequest -Uri $asset.url -Headers @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/octet-stream"
          } -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force

          $compilerSource = Get-ChildItem -Path $extractRoot -Recurse -File -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compilerSource) {
            throw "Downloaded Ahk2Exe asset but Ahk2Exe.exe was not found in extracted contents."
          }

          $compilerTargetDir = Join-Path $ahkBase "Compiler"
          if (Test-Path $compilerTargetDir) { Remove-Item -Path $compilerTargetDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $compilerTargetDir | Out-Null
          Copy-Item -Path (Join-Path $extractRoot "*") -Destination $compilerTargetDir -Recurse -Force
          $compilerPath = Join-Path $compilerTargetDir "Ahk2Exe.exe"
          if (-not (Test-Path $compilerPath)) { throw "Ahk2Exe deploy failed: $compilerPath not found after copy." }
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          Copy-Item -Path (Join-Path $compilerTargetDir "*") -Destination $cacheRoot -Recurse -Force
          $baseExe = Find-AhkBase
          if (-not $baseExe) { throw "AutoHotkey base executable not found for runtime=$env:RUNTIME." }
          "AHK2EXE_PATH=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AHK_BASE_PATH=$baseExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile injector AHK module
        if: steps.cache_injector_module.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Compiling Injector.exe from agents.modules.Injector.version=$env:INJECTOR_MODULE_VERSION"

          $moduleVersion4 = "$env:INJECTOR_MODULE_VERSION.0"
          $compiler = $env:AHK2EXE_PATH
          $baseExe = $env:AHK_BASE_PATH
          if (-not (Test-Path $compiler)) { throw "Ahk2Exe.exe not found: $compiler" }
          if (-not $baseExe) { throw "AutoHotkey base executable not found under C:\Program Files\AutoHotkey." }

          $workspace = $env:GITHUB_WORKSPACE
          $injectorDirPath = (Resolve-Path (Join-Path $workspace "runtime/agents/modules/injector")).Path
          $mainScript = Join-Path $injectorDirPath "main.ahk"
          if (-not (Test-Path $mainScript)) { throw "AHK entry script not found: $mainScript" }
          $entryPath = Join-Path $injectorDirPath "__ci_compile_entry__.ahk"
          $moduleDir = Join-Path $workspace "artifacts/agents/$env:RUNTIME/Modules/Injector"
          New-Item -ItemType Directory -Path $moduleDir -Force | Out-Null
          $outExe = Join-Path $moduleDir "Injector.exe"
          $entryLines = @(
            "; CI-only: inject release-manifest module version into PE metadata.",
            ";@Ahk2Exe-Set Version, $moduleVersion4",
            ";@Ahk2Exe-Set FileVersion, $moduleVersion4",
            ";@Ahk2Exe-Set ProductVersion, $moduleVersion4",
            ('#Include "{0}"' -f $mainScript)
          )
          Set-Content -Path $entryPath -Value $entryLines -Encoding utf8
          $compilerDir = Split-Path -Path $compiler -Parent
          try {
            Remove-Item -Path $outExe -Force -ErrorAction SilentlyContinue
            $argLine = @(
              ('/in "{0}"' -f $entryPath),
              ('/out "{0}"' -f $outExe),
              ('/base "{0}"' -f $baseExe),
              '/silent'
            ) -join " "
            Write-Host ("Ahk2Exe args: " + $argLine)
            Write-Host ("Ahk2Exe working directory: " + $compilerDir)
            Write-Host ("Expected output: " + $outExe)
            $proc = Start-Process -FilePath $compiler -ArgumentList $argLine -WorkingDirectory $compilerDir -PassThru -Wait
            if ($null -ne $proc.ExitCode -and $proc.ExitCode -ne 0) {
              throw "Ahk2Exe exited with code $($proc.ExitCode)"
            }
          }
          finally {
            if (Test-Path $entryPath) { Remove-Item $entryPath -Force }
          }
          if (-not (Test-Path $outExe)) {
            Write-Host "Compiler directory contents for diagnosis:"
            Get-ChildItem -Path $compilerDir -Force | Select-Object Name, Length, Mode | Format-Table -AutoSize | Out-String | Write-Host
            throw "Injector compile output missing: $outExe"
          }
          $cacheDir = Join-Path $env:USERPROFILE "PacToolkits-Agents-cache\$env:RUNTIME"
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          Copy-Item $outExe (Join-Path $cacheDir "Injector.exe") -Force
          Write-Host "Cached Injector.exe for future runs."

      - name: Restore cached injector module
        if: steps.cache_injector_module.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $cachedExe = Join-Path $env:USERPROFILE "PacToolkits-Agents-cache\$env:RUNTIME\Injector.exe"
          if (-not (Test-Path $cachedExe)) {
            throw "cache-hit=true but cached injector binary is missing: $cachedExe"
          }
          $moduleDir = "artifacts/agents/$env:RUNTIME/Modules/Injector"
          New-Item -ItemType Directory -Path $moduleDir -Force | Out-Null
          Copy-Item $cachedExe (Join-Path $moduleDir "Injector.exe") -Force

      - name: Publish Host
        shell: pwsh
        run: |
          $stagingDir = "artifacts/agents/$env:RUNTIME"
          $moduleDir = Join-Path $stagingDir "Modules/Injector"
          New-Item -ItemType Directory -Path $moduleDir -Force | Out-Null
          Copy-Item "runtime/agents/modules/injector/module.json" (Join-Path $moduleDir "module.json") -Force
          # Framework-dependent like Desktop: Host is a thin module launcher, not a second runtime bundle.
          # (EnableCompressionInSingleFile requires self-contained — keep it off for FDD.)
          dotnet publish "runtime/agents/host/PacToolkits.Agents.Host.csproj" `
            -c Release `
            -r $env:RUNTIME `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o $stagingDir `
            --verbosity minimal
          $hostExe = Join-Path $stagingDir "Agents.exe"
          if (-not (Test-Path $hostExe)) { throw "Host binary missing: $hostExe" }

      - name: Validate Agents binaries
        shell: pwsh
        run: |
          $hostExe = "artifacts/agents/$env:RUNTIME/Agents.exe"
          $moduleExe = "artifacts/agents/$env:RUNTIME/Modules/Injector/Injector.exe"
          foreach ($outExe in @($hostExe, $moduleExe)) {
            if (-not (Test-Path $outExe)) { throw "Agents binary missing: $outExe" }
            $bytes = [System.IO.File]::ReadAllBytes($outExe)
            if ($bytes.Length -lt 0x40) {
              throw "Agents binary too small to be a valid PE file: $outExe"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -le 0 -or ($peOffset + 6) -ge $bytes.Length) {
              throw "Invalid PE header offset in Agents binary: $outExe"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw ("Agents binary is not x64. PE Machine=0x{0:X4} path=$outExe" -f $machine)
            }
          }

          $fileVersion = (Get-Item $moduleExe).VersionInfo.FileVersion
          $productVersion = (Get-Item $moduleExe).VersionInfo.ProductVersion
          $moduleVersion4 = "$env:INJECTOR_MODULE_VERSION.0"
          if ($fileVersion -ne $moduleVersion4) {
            throw "Injector FileVersion mismatch. expected=$moduleVersion4 actual=$fileVersion"
          }
          if ($productVersion -ne $moduleVersion4) {
            throw "Injector ProductVersion mismatch. expected=$moduleVersion4 actual=$productVersion"
          }
          if (-not (Test-Path "artifacts/agents/$env:RUNTIME/Modules/Injector/module.json")) {
            throw "module.json missing in staging output"
          }

      - name: Upload Agents artifact
        uses: actions/upload-artifact@v7
        with:
          name: PacToolkits-Agents-${{ env.RUNTIME }}-${{ env.AGENTS_VERSION }}
          path: artifacts/agents/${{ env.RUNTIME }}/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days || 3 }}
