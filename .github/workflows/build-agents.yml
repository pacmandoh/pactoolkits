name: Build Agents

on:
  workflow_call:
    inputs:
      runtime:
        required: false
        type: string
        default: win-x64
      artifact_retention_days:
        required: false
        type: number
        default: 3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_agents:
    name: Build Agents host and AHK modules
    runs-on: windows-latest
    env:
      RUNTIME: ${{ inputs.runtime || 'win-x64' }}
      AUTOHOTKEY_VERSION: 2.0.19
      AHK2EXE_TAG: Ahk2Exe1.1.37.02a2
      AHK2EXE_ZIP_SHA256: c29b8c3a5124850d79fc9e66e2ca79677c377d7f31631ad3022ba159c5d9e3be
      AHK2EXE_EXE_SHA256: e54a599b19baa5c1688849bbae7a9cf049eefccd4f704c67941b40da13a625b2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Validate Agents contracts and module settings
        shell: pwsh
        run: |
          dotnet restore "tests/PacToolkits.Agents.Contracts.Tests/PacToolkits.Agents.Contracts.Tests.csproj" `
            --locked-mode
          dotnet test "tests/PacToolkits.Agents.Contracts.Tests/PacToolkits.Agents.Contracts.Tests.csproj" `
            -c Release `
            --no-restore `
            --verbosity minimal

      - name: Read manifest agents version
        id: versions
        shell: pwsh
        run: |
          if ($env:RUNTIME -ne "win-x64") {
            throw "Agents currently supports runtime=win-x64 only; got $env:RUNTIME"
          }
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          $agentsVersion = $manifest.components.'agents'.version
          if ($agentsVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid agents version in release-manifest.json: $agentsVersion"
          }
          $manifestModules = $manifest.components.'agents'.modules
          if ($null -eq $manifestModules) {
            throw "release-manifest.json missing components.agents.modules"
          }
          $moduleVersions = @{}
          foreach ($prop in $manifestModules.PSObject.Properties) {
            $moduleId = $prop.Name
            if ($moduleId -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
              throw "Invalid agents module id in release-manifest.json: $moduleId"
            }
            $moduleVersion = $prop.Value.version
            if ($moduleVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid agents.modules.$moduleId.version in release-manifest.json: $moduleVersion"
            }
            $moduleVersions[$moduleId] = $moduleVersion
          }
          if ($moduleVersions.Count -eq 0) {
            throw "release-manifest.json components.agents.modules has no entries"
          }
          "AGENTS_VERSION=$agentsVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validated $($moduleVersions.Count) agent module version(s) from release-manifest.json"

      - name: Sync module.json versions from manifest
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          $manifestModules = $manifest.components.'agents'.modules
          $modulesRoot = "runtime/agents/modules"
          if (-not (Test-Path $modulesRoot)) {
            throw "missing agents modules root: $modulesRoot"
          }
          Get-ChildItem -Path $modulesRoot -Directory | ForEach-Object {
            $moduleJsonPath = Join-Path $_.FullName "module.json"
            if (-not (Test-Path $moduleJsonPath)) {
              return
            }
            $module = Get-Content $moduleJsonPath -Raw | ConvertFrom-Json
            $moduleId = [string]$module.id
            if ([string]::IsNullOrWhiteSpace($moduleId)) {
              throw "module.json missing id: $moduleJsonPath"
            }
            if ($moduleId -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]*$') {
              throw "Invalid module.json id: $moduleId ($moduleJsonPath)"
            }
            $manifestEntry = $manifestModules.$moduleId
            if ($null -eq $manifestEntry) {
              throw "release-manifest.json missing components.agents.modules.$moduleId (module.json at $moduleJsonPath)"
            }
            $manifestVersion = [string]$manifestEntry.version
            if ($manifestVersion -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid agents.modules.$moduleId.version in release-manifest.json: $manifestVersion"
            }
            $module.version = $manifestVersion
            $module | ConvertTo-Json -Depth 20 | Set-Content -Path $moduleJsonPath -Encoding utf8
            Write-Host "Synced $moduleId module.json version=$manifestVersion"
          }

      - name: Cache AHK module binaries
        id: cache_ahk_modules
        uses: actions/cache@v5
        with:
          path: ~\PacToolkits-Agents-cache\${{ env.RUNTIME }}\modules\
          key: ${{ runner.os }}-ahk-modules-${{ env.RUNTIME }}-ahk${{ env.AUTOHOTKEY_VERSION }}-${{ env.AHK2EXE_TAG }}-${{ env.AHK2EXE_EXE_SHA256 }}-${{ hashFiles('runtime/agents/modules/**/main.ahk', 'runtime/agents/modules/**/src/**/*.ahk', 'runtime/agents/modules/**/assets/**/*.ico', 'runtime/agents/modules/**/module.json') }}

      - name: Report AHK modules cache status
        shell: pwsh
        run: |
          Write-Host "cache.ahk_modules.hit=${{ steps.cache_ahk_modules.outputs.cache-hit }}"

      - name: Install AutoHotkey
        if: steps.cache_ahk_modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $baseCandidates = @(
            "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe",
            "C:\Program Files\AutoHotkey\AutoHotkey64.exe"
          )
          $baseExe = $baseCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          [string]$actualVersion = if ($baseExe) { (Get-Item $baseExe).VersionInfo.ProductVersion } else { "" }
          if (-not $actualVersion.StartsWith($env:AUTOHOTKEY_VERSION, [System.StringComparison]::Ordinal)) {
            choco install autohotkey --version=$env:AUTOHOTKEY_VERSION --allow-downgrade --force --no-progress -y
            $baseExe = $baseCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            [string]$actualVersion = if ($baseExe) { (Get-Item $baseExe).VersionInfo.ProductVersion } else { "" }
          }
          if (-not $baseExe -or -not $actualVersion.StartsWith($env:AUTOHOTKEY_VERSION, [System.StringComparison]::Ordinal)) {
            throw "AutoHotkey version mismatch: expected=$env:AUTOHOTKEY_VERSION actual=$actualVersion"
          }

      - name: Cache Ahk2Exe asset
        if: steps.cache_ahk_modules.outputs.cache-hit != 'true'
        id: cache_ahk2exe
        uses: actions/cache@v5
        with:
          path: ~\ahk2exe-cache
          key: ${{ runner.os }}-ahk2exe-${{ env.AHK2EXE_TAG }}-${{ env.AHK2EXE_EXE_SHA256 }}

      - name: Resolve Ahk2Exe compiler
        if: steps.cache_ahk_modules.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ahkBase = "C:\Program Files\AutoHotkey"
          function Test-PeExecutable {
            param([string]$Path)
            if (-not (Test-Path $Path)) { return $false }
            if ([System.IO.Path]::GetExtension($Path) -ne '.exe') { return $false }
            try {
              $bytes = [System.IO.File]::ReadAllBytes($Path)
              if ($bytes.Length -lt 0x40) { return $false }
              if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { return $false }
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              return $peOffset -gt 0 -and ($peOffset + 6) -lt $bytes.Length
            } catch {
              return $false
            }
          }

          function Find-AhkBase {
            $directCandidates = @(
              (Join-Path $ahkBase "v2\AutoHotkey64.exe"),
              (Join-Path $ahkBase "AutoHotkey64.exe"),
              (Join-Path $ahkBase "Compiler\AutoHotkey64.exe"),
              (Join-Path $ahkBase "Compiler\Base Files\AutoHotkey64.exe")
            )
            $base = $directCandidates | Where-Object { Test-PeExecutable $_ } | Select-Object -First 1
            if ($base) { return $base }
            Get-ChildItem -Path $ahkBase -Recurse -File -Filter "AutoHotkey64.exe" -ErrorAction SilentlyContinue |
              Where-Object { Test-PeExecutable $_.FullName } |
              Select-Object -First 1 -ExpandProperty FullName
          }

          $cacheRoot = Join-Path $env:USERPROFILE "ahk2exe-cache"
          $cachedCompiler = Join-Path $cacheRoot "Ahk2Exe.exe"
          if (Test-Path $cachedCompiler) {
            $cachedHash = (Get-FileHash -Path $cachedCompiler -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($cachedHash -eq $env:AHK2EXE_EXE_SHA256) {
              $baseExe = Find-AhkBase
              if (-not $baseExe) { throw "AutoHotkey base executable not found for runtime=$env:RUNTIME." }
              "AHK2EXE_PATH=$cachedCompiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "AHK_BASE_PATH=$baseExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
            Remove-Item -Path $cacheRoot -Recurse -Force
          }

          $api = "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/tags/$env:AHK2EXE_TAG"
          $headers = @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri $api -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "Ahk2Exe*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No Ahk2Exe zip asset found." }

          $stageRoot = Join-Path $env:RUNNER_TEMP "ahk2exe-stage"
          $zipPath = Join-Path $stageRoot "Ahk2Exe.zip"
          $extractRoot = Join-Path $stageRoot "extract"
          if (Test-Path $stageRoot) { Remove-Item -Path $stageRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null
          Invoke-WebRequest -Uri $asset.url -Headers @{
            "Authorization" = "Bearer $env:GITHUB_TOKEN"
            "Accept" = "application/octet-stream"
          } -OutFile $zipPath
          $actualHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:AHK2EXE_ZIP_SHA256) {
            throw "Ahk2Exe archive hash mismatch: expected=$env:AHK2EXE_ZIP_SHA256 actual=$actualHash"
          }
          Expand-Archive -Path $zipPath -DestinationPath $extractRoot -Force

          $compilerSource = Get-ChildItem -Path $extractRoot -Recurse -File -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compilerSource) {
            throw "Downloaded Ahk2Exe asset but Ahk2Exe.exe was not found in extracted contents."
          }

          if (Test-Path $cacheRoot) { Remove-Item -Path $cacheRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
          Copy-Item -Path (Join-Path $extractRoot "*") -Destination $cacheRoot -Recurse -Force
          $compilerPath = $cachedCompiler
          if (-not (Test-Path $compilerPath)) { throw "Ahk2Exe deploy failed: $compilerPath not found after copy." }
          $compilerHash = (Get-FileHash -Path $compilerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($compilerHash -ne $env:AHK2EXE_EXE_SHA256) {
            throw "Ahk2Exe executable hash mismatch: expected=$env:AHK2EXE_EXE_SHA256 actual=$compilerHash"
          }
          $baseExe = Find-AhkBase
          if (-not $baseExe) { throw "AutoHotkey base executable not found for runtime=$env:RUNTIME." }
          "AHK2EXE_PATH=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AHK_BASE_PATH=$baseExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile AHK modules
        if: steps.cache_ahk_modules.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          $manifestModules = $manifest.components.'agents'.modules
          $compiler = $env:AHK2EXE_PATH
          $baseExe = $env:AHK_BASE_PATH
          if (-not (Test-Path $compiler)) { throw "Ahk2Exe.exe not found: $compiler" }
          if (-not $baseExe) { throw "AutoHotkey base executable not found under C:\Program Files\AutoHotkey." }

          $workspace = $env:GITHUB_WORKSPACE
          $modulesRoot = Join-Path $workspace "runtime/agents/modules"
          $stagingModulesRoot = Join-Path $workspace "artifacts/agents/$env:RUNTIME/Modules"
          $cacheModulesRoot = Join-Path $env:USERPROFILE "PacToolkits-Agents-cache\$env:RUNTIME\modules"
          New-Item -ItemType Directory -Path $stagingModulesRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $cacheModulesRoot -Force | Out-Null

          $compilerDir = Split-Path -Path $compiler -Parent
          $compiledAny = $false

          Get-ChildItem -Path $modulesRoot -Directory | ForEach-Object {
            $moduleDirPath = $_.FullName
            $moduleJsonPath = Join-Path $moduleDirPath "module.json"
            if (-not (Test-Path $moduleJsonPath)) {
              return
            }

            $moduleMeta = Get-Content $moduleJsonPath -Raw | ConvertFrom-Json
            $moduleId = [string]$moduleMeta.id
            if ([string]::IsNullOrWhiteSpace($moduleId)) {
              throw "module.json missing id: $moduleJsonPath"
            }

            $runtimeKind = [string]$moduleMeta.runtime
            $hasBuilder = $null -ne $moduleMeta.package -and $null -ne $moduleMeta.package.builder
            if ($runtimeKind -ne "ahk") {
              if ($hasBuilder) {
                throw "Unsupported module package builder for runtime=$runtimeKind module=$moduleId (only ahk + ahk2exe is supported today)"
              }
              Write-Host "Skipping non-AHK module (no package.builder): $moduleId"
              return
            }

            if (-not $hasBuilder -or [string]$moduleMeta.package.builder -ne "ahk2exe") {
              throw "AHK module $moduleId must set package.builder to ahk2exe; got '$($moduleMeta.package.builder)'"
            }

            $manifestEntry = $manifestModules.$moduleId
            if ($null -eq $manifestEntry) {
              throw "release-manifest.json missing components.agents.modules.$moduleId"
            }
            $manifestVersion = [string]$manifestEntry.version
            $moduleVersion4 = "$manifestVersion.0"

            $iconRel = [string]$moduleMeta.package.ahk2exe.icon
            if ([string]::IsNullOrWhiteSpace($iconRel)) {
              throw "module.json missing package.ahk2exe.icon for module=$moduleId"
            }
            if ([IO.Path]::IsPathRooted($iconRel)) {
              throw "module.json package.ahk2exe.icon must be relative for module=$moduleId : $iconRel"
            }
            $moduleRoot = [IO.Path]::GetFullPath($moduleDirPath).TrimEnd('\') + '\'
            $iconPath = [IO.Path]::GetFullPath(
              (Join-Path $moduleDirPath (($iconRel -replace '/', [IO.Path]::DirectorySeparatorChar))))
            if (-not $iconPath.StartsWith($moduleRoot, [StringComparison]::OrdinalIgnoreCase)) {
              throw "module.json package.ahk2exe.icon escapes module dir for module=$moduleId : $iconRel"
            }
            if (-not (Test-Path $iconPath)) {
              throw "Module icon not found: $iconPath (from package.ahk2exe.icon) module=$moduleId"
            }

            $entryExeName = [string]$moduleMeta.entry.'win-x64'
            if ([string]::IsNullOrWhiteSpace($entryExeName)) {
              throw "module.json missing entry.win-x64 for module=$moduleId"
            }
            if ([IO.Path]::GetFileName($entryExeName) -ne $entryExeName) {
              throw "module.json entry.win-x64 must be a file name for module=$moduleId : $entryExeName"
            }

            $mainScript = Join-Path $moduleDirPath "main.ahk"
            if (-not (Test-Path $mainScript)) {
              throw "AHK entry script not found: $mainScript (module=$moduleId)"
            }

            Write-Host "Compiling $entryExeName for module=$moduleId manifestVersion=$manifestVersion"

            $moduleStagingDir = Join-Path $stagingModulesRoot $moduleId
            New-Item -ItemType Directory -Path $moduleStagingDir -Force | Out-Null
            Copy-Item $moduleJsonPath (Join-Path $moduleStagingDir "module.json") -Force
            foreach ($settingsName in @("settings.json", "settings.schema.json")) {
              $settingsSrc = Join-Path $moduleDirPath $settingsName
              if (-not (Test-Path $settingsSrc)) {
                throw "Missing $settingsName for module=$moduleId (required next to module.json)"
              }
              Copy-Item $settingsSrc (Join-Path $moduleStagingDir $settingsName) -Force
            }

            $outExe = Join-Path $moduleStagingDir $entryExeName
            $entryPath = Join-Path $moduleDirPath "__ci_compile_entry__.ahk"
            $entryLines = @(
              "; CI 专用：把 release-manifest 模块版本写入 PE 元数据",
              ";@Ahk2Exe-Set Version, $moduleVersion4",
              ";@Ahk2Exe-Set FileVersion, $moduleVersion4",
              ";@Ahk2Exe-Set ProductVersion, $moduleVersion4",
              ('#Include "{0}"' -f $mainScript)
            )
            Set-Content -Path $entryPath -Value $entryLines -Encoding utf8
            try {
              Remove-Item -Path $outExe -Force -ErrorAction SilentlyContinue
              $argLine = @(
                ('/in "{0}"' -f $entryPath),
                ('/out "{0}"' -f $outExe),
                ('/base "{0}"' -f $baseExe),
                ('/icon "{0}"' -f $iconPath),
                '/silent'
              ) -join " "
              Write-Host ("Ahk2Exe args: " + $argLine)
              Write-Host ("Ahk2Exe working directory: " + $compilerDir)
              Write-Host ("Expected output: " + $outExe)
              $proc = Start-Process -FilePath $compiler -ArgumentList $argLine -WorkingDirectory $compilerDir -PassThru -Wait
              if ($null -ne $proc.ExitCode -and $proc.ExitCode -ne 0) {
                throw "Ahk2Exe exited with code $($proc.ExitCode) for module=$moduleId"
              }
            }
            finally {
              if (Test-Path $entryPath) { Remove-Item $entryPath -Force }
            }

            if (-not (Test-Path $outExe)) {
              Write-Host "Compiler directory contents for diagnosis:"
              Get-ChildItem -Path $compilerDir -Force | Select-Object Name, Length, Mode | Format-Table -AutoSize | Out-String | Write-Host
              throw "AHK compile output missing: $outExe (module=$moduleId)"
            }

            $moduleCacheDir = Join-Path $cacheModulesRoot $moduleId
            if (Test-Path $moduleCacheDir) { Remove-Item -Path $moduleCacheDir -Recurse -Force }
            New-Item -ItemType Directory -Path $moduleCacheDir -Force | Out-Null
            Copy-Item (Join-Path $moduleStagingDir "*") $moduleCacheDir -Recurse -Force
            Write-Host "Cached module output for $moduleId"
            $compiledAny = $true
          }

          if (-not $compiledAny) {
            throw "No AHK modules were compiled under $modulesRoot"
          }

      - name: Publish Host
        shell: pwsh
        run: |
          $stagingDir = "artifacts/agents/$env:RUNTIME"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          Copy-Item "runtime/agents/host/ReleaseManifest.json" (Join-Path $stagingDir "ReleaseManifest.json") -Force
          # Host 与 Desktop 共用目标机 .NET Runtime，避免在同一安装包重复携带运行时
          # FDD 不支持单文件压缩，因此显式关闭 EnableCompressionInSingleFile
          dotnet restore "runtime/agents/host/PacToolkits.Agents.Host.csproj" `
            --locked-mode
          dotnet publish "runtime/agents/host/PacToolkits.Agents.Host.csproj" `
            -c Release `
            -r $env:RUNTIME `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o $stagingDir `
            --verbosity minimal
          $hostExe = Join-Path $stagingDir "Agents.exe"
          if (-not (Test-Path $hostExe)) { throw "Host binary missing: $hostExe" }

          $cacheModulesRoot = Join-Path $env:USERPROFILE "PacToolkits-Agents-cache\$env:RUNTIME\modules"
          $stagingModulesRoot = Join-Path $stagingDir "Modules"
          if (-not (Test-Path $cacheModulesRoot)) {
            throw "AHK modules cache directory is missing after cache/compile: $cacheModulesRoot"
          }
          if (Test-Path $stagingModulesRoot) { Remove-Item -Path $stagingModulesRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $stagingModulesRoot -Force | Out-Null
          Copy-Item (Join-Path $cacheModulesRoot "*") $stagingModulesRoot -Recurse -Force
          Write-Host "Restored AHK module outputs into staging after Host publish"

          # 配置与 schema 不影响二进制编译，缓存恢复后从当前源码覆盖以避免陈旧配置
          Get-ChildItem -Path $stagingModulesRoot -Directory | ForEach-Object {
            $moduleId = $_.Name
            $srcDir = Get-ChildItem -Path "runtime/agents/modules" -Directory |
              Where-Object {
                $mj = Join-Path $_.FullName "module.json"
                (Test-Path $mj) -and ((Get-Content $mj -Raw | ConvertFrom-Json).id -eq $moduleId)
              } |
              Select-Object -First 1 -ExpandProperty FullName
            if ([string]::IsNullOrWhiteSpace($srcDir)) {
              throw "Cannot resolve source dir for staging module=$moduleId"
            }
            foreach ($settingsName in @("settings.json", "settings.schema.json", "module.json")) {
              $src = Join-Path $srcDir $settingsName
              if (-not (Test-Path $src)) {
                throw "Missing $settingsName for module=$moduleId at $src"
              }
              Copy-Item $src (Join-Path $_.FullName $settingsName) -Force
            }
          }
          Write-Host "Overlaid module settings/module.json from source into staging"

      - name: Validate Agents binaries
        shell: pwsh
        run: |
          function Test-PeX64 {
            param([string]$Path)
            if (-not (Test-Path $Path)) { throw "Agents binary missing: $Path" }
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            if ($bytes.Length -lt 0x40) {
              throw "Agents binary too small to be a valid PE file: $Path"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            if ($peOffset -le 0 -or ($peOffset + 6) -ge $bytes.Length) {
              throw "Invalid PE header offset in Agents binary: $Path"
            }
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw ("Agents binary is not x64. PE Machine=0x{0:X4} path=$Path" -f $machine)
            }
          }

          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          $manifestModules = $manifest.components.'agents'.modules

          $hostExe = "artifacts/agents/$env:RUNTIME/Agents.exe"
          Test-PeX64 -Path $hostExe

          $hostFileVersion = (Get-Item $hostExe).VersionInfo.FileVersion
          $hostProductVersion = (Get-Item $hostExe).VersionInfo.ProductVersion
          $agentsVersion4 = "$env:AGENTS_VERSION.0"
          if ($hostFileVersion -ne $agentsVersion4) {
            throw "Host FileVersion mismatch. expected=$agentsVersion4 actual=$hostFileVersion"
          }
          if ($hostProductVersion -ne $agentsVersion4 -and $hostProductVersion -notlike "$env:AGENTS_VERSION*") {
            throw "Host ProductVersion mismatch. expected prefix=$env:AGENTS_VERSION actual=$hostProductVersion"
          }

          $modulesRoot = "artifacts/agents/$env:RUNTIME/Modules"
          if (-not (Test-Path $modulesRoot)) {
            throw "Modules staging directory missing: $modulesRoot"
          }

          # CI 与发布脚本执行同一精确集合约束，避免缓存残留模块进入产物
          $manifestModuleIds = @($manifestModules.PSObject.Properties | ForEach-Object { $_.Name })
          if ($manifestModuleIds.Count -eq 0) {
            throw "release-manifest.json components.agents.modules has no entries"
          }

          foreach ($moduleId in $manifestModuleIds) {
            $moduleDir = Join-Path $modulesRoot $moduleId
            if (-not (Test-Path $moduleDir)) {
              throw "Missing staging module dir for manifest id=$moduleId : $moduleDir"
            }

            foreach ($requiredName in @("module.json", "settings.json", "settings.schema.json")) {
              $requiredPath = Join-Path $moduleDir $requiredName
              if (-not (Test-Path $requiredPath)) {
                throw "Missing $requiredName for module=$moduleId : $requiredPath"
              }
            }

            $moduleJsonPath = Join-Path $moduleDir "module.json"
            $moduleMeta = Get-Content $moduleJsonPath -Raw | ConvertFrom-Json
            $jsonId = [string]$moduleMeta.id
            if ($jsonId -ne $moduleId) {
              throw "module.json id=$jsonId != directory/manifest id=$moduleId ($moduleJsonPath)"
            }
            $entryExeName = [string]$moduleMeta.entry.'win-x64'
            if ([string]::IsNullOrWhiteSpace($entryExeName)) {
              throw "module.json missing entry.win-x64: $moduleJsonPath"
            }
            if ([IO.Path]::GetFileName($entryExeName) -ne $entryExeName) {
              throw "module.json entry.win-x64 must be a file name for module=$moduleId : $entryExeName"
            }
            $moduleExe = Join-Path $moduleDir $entryExeName
            Test-PeX64 -Path $moduleExe

            $manifestVersion = [string]$manifestModules.$moduleId.version
            $jsonVersion = [string]$moduleMeta.version
            if ($jsonVersion -ne $manifestVersion) {
              throw "module.json version=$jsonVersion != release-manifest modules.$moduleId.version=$manifestVersion ($moduleJsonPath)"
            }
            $moduleVersion4 = "$manifestVersion.0"
            $fileVersion = (Get-Item $moduleExe).VersionInfo.FileVersion
            $productVersion = (Get-Item $moduleExe).VersionInfo.ProductVersion
            if ($fileVersion -ne $moduleVersion4) {
              throw "Module $moduleId FileVersion mismatch. expected=$moduleVersion4 actual=$fileVersion"
            }
            if ($productVersion -ne $moduleVersion4) {
              throw "Module $moduleId ProductVersion mismatch. expected=$moduleVersion4 actual=$productVersion"
            }
            Write-Host "Validated module=$moduleId exe=$entryExeName version=$manifestVersion"
          }

          $extraDirs = Get-ChildItem -Path $modulesRoot -Directory | Where-Object { $manifestModuleIds -notcontains $_.Name }
          foreach ($extra in $extraDirs) {
            throw "Staging has module dir not listed in release-manifest.json: $($extra.FullName)"
          }

          if (-not (Test-Path "artifacts/agents/$env:RUNTIME/ReleaseManifest.json")) {
            throw "ReleaseManifest.json missing in Agents staging output"
          }

      - name: Upload Agents artifact
        uses: actions/upload-artifact@v7
        with:
          name: PacToolkits-Agents-${{ env.RUNTIME }}-${{ env.AGENTS_VERSION }}
          path: artifacts/agents/${{ env.RUNTIME }}/
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days || 3 }}
