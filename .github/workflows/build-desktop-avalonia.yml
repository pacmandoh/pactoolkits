name: Build Desktop Avalonia

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_desktop_avalonia:
    name: Build Desktop Avalonia
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.csproj', '**/Directory.Packages.props', '**/NuGet.Config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Export version artifacts
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/export-version.sh
          ./scripts/check-version.sh

      - name: Read release manifest
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck source=manifest-v2.sh
          source scripts/manifest-v2.sh
          validate_manifest_v2 release-manifest.json
          echo "DESKTOP_VERSION=$(manifest_desktop_version release-manifest.json)" >> "$GITHUB_ENV"

      - name: Publish desktop
        shell: bash
        run: |
          dotnet publish apps/desktop-avalonia/src/PacToolkits.Desktop.Avalonia.csproj -c Release -f net10.0 -r win-x64 --self-contained false

      - name: Validate publish output
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="apps/desktop-avalonia/src/bin/Release/net10.0/win-x64/publish"
          required_files=(
            "pactoolkits-desktop.exe"
            "Sql/Bootstrap/000_init_meta.sql"
            "Sql/Verify/01_structure.sql"
            "Sql/Verify/02_constraints.sql"
            "Sql/Verify/03_schema_version.sql"
          )
          for file in "${required_files[@]}"; do
            path="$publish_dir/$file"
            [[ -f "$path" ]] || {
              echo "Required publish output missing: $path" >&2
              exit 1
            }
          done

      - name: Upload desktop publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: pactoolkits-desktop-avalonia-win-x64-${{ env.DESKTOP_VERSION }}
          path: apps/desktop-avalonia/src/bin/Release/net10.0/win-x64/publish/
          if-no-files-found: error
